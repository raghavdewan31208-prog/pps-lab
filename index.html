namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int r,c,a[100][100]; cin >> r >> c; for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> a[i][k];\n    for(int k=0;k<c;k++){ for(int i=0;i<r;i++) cout << a[i][k] << (i+1<r ? \" \" : \"\"); if(k+1<c) cout << \"\\n\"; }\n    return 0;\n}","hints":["Rows and columns exchange roles.","The element at original row i, column k becomes row k, column i.","Loop over columns first, then rows."],"explanation":"Transpose changes A[i][k] into A-transpose[k][i]."},{"id":"A24","topic":"Arrays","subtopic":"2D arrays · row sums","difficulty":"Easy","title":"Sum of each matrix row","statement":"Read an r by c matrix and print the sum of every row.","inputFormat":"Rows, columns, then matrix values row-wise.","outputFormat":"One row sum per line.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2 3\n1 2 3\n4 5 6\n","output":"6\n15"},{"input":"1 3\n-1 0 4\n","output":"3"}],"tests":[{"input":"1 3\n-1 0 4\n","expected":"3"},{"input":"3 1\n2\n5\n-1\n","expected":"2\n5\n-1"},{"input":"2 3\n1 2 3\n4 5 6\n","expected":"6\n15"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int r,c,a[100][100]; cin >> r >> c; for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> a[i][k];\n    for(int i=0;i<r;i++){ int sum=0; for(int k=0;k<c;k++) sum += a[i][k]; cout << sum; if(i+1<r) cout << \"\\n\"; }\n    return 0;\n}","hints":["Reset the sum for each new row.","Add all c elements from the current row.","Print the row sum before moving to the next row."],"explanation":"The outer loop selects a row; the inner loop accumulates its values."},{"id":"A25","topic":"Arrays","subtopic":"2D arrays · column sums","difficulty":"Easy","title":"Sum of each matrix column","statement":"Read an r by c matrix and print the sum of every column.","inputFormat":"Rows, columns, then matrix values.","outputFormat":"One sum per column, separated by spaces.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2 3\n1 2 3\n4 5 6\n","output":"5 7 9"},{"input":"1 2\n8 9\n","output":"8 9"}],"tests":[{"input":"1 2\n8 9\n","expected":"8 9"},{"input":"3 1\n2\n5\n-1\n","expected":"6"},{"input":"2 3\n1 2 3\n4 5 6\n","expected":"5 7 9"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int r,c,a[100][100]; cin >> r >> c; for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> a[i][k];\n    for(int k=0;k<c;k++){ int sum=0; for(int i=0;i<r;i++) sum += a[i][k]; cout << sum << (k+1<c ? \" \" : \"\"); }\n    return 0;\n}","hints":["Choose a column first.","Add values while moving down the rows.","Reset sum for each column."],"explanation":"The inner loop traverses rows for a fixed column index."},{"id":"A26","topic":"Arrays","subtopic":"2D arrays · diagonals","difficulty":"Medium","title":"Main and secondary diagonal sums","statement":"Given a square matrix, calculate the sum of its main and secondary diagonals. The center of an odd-sized matrix is counted in both sums.","inputFormat":"N followed by an N by N matrix.","outputFormat":"Print main diagonal sum and secondary diagonal sum.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"3\n1 2 3\n4 5 6\n7 8 9\n","output":"15 15"},{"input":"1\n8\n","output":"8 8"}],"tests":[{"input":"1\n8\n","expected":"8 8"},{"input":"2\n1 2\n3 4\n","expected":"5 5"},{"input":"3\n1 2 3\n4 5 6\n7 8 9\n","expected":"15 15"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100][100],mainSum=0,secondarySum=0; cin >> n;\n    for(int i=0;i<n;i++) for(int k=0;k<n;k++) cin >> a[i][k];\n    for(int i=0;i<n;i++){ mainSum += a[i][i]; secondarySum += a[i][n-1-i]; }\n    cout << mainSum << \" \" << secondarySum; return 0;\n}","hints":["The main diagonal has row index equal to column index.","The secondary diagonal satisfies row + column = n-1.","Use a single loop from 0 to n-1."],"explanation":"For each row i, the two diagonal positions are a[i][i] and a[i][n-1-i]."},{"id":"A27","topic":"Arrays","subtopic":"2D arrays · identity matrix","difficulty":"Medium","title":"Check identity matrix","statement":"Determine whether a square matrix is an identity matrix: diagonal elements must be 1 and all other elements 0.","inputFormat":"N followed by an N by N matrix.","outputFormat":"Print YES or NO.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"3\n1 0 0\n0 1 0\n0 0 1\n","output":"YES"},{"input":"2\n1 0\n0 1\n","output":"YES"}],"tests":[{"input":"2\n1 0\n0 1\n","expected":"YES"},{"input":"2\n1 1\n0 1\n","expected":"NO"},{"input":"3\n1 0 0\n0 1 0\n0 0 1\n","expected":"YES"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100][100],ok=1; cin >> n;\n    for(int i=0;i<n;i++) for(int k=0;k<n;k++) cin >> a[i][k];\n    for(int i=0;i<n;i++) for(int k=0;k<n;k++){ if(i==k && a[i][k]!=1) ok=0; if(i!=k && a[i][k]!=0) ok=0; }\n    cout << (ok ? \"YES\" : \"NO\"); return 0;\n}","hints":["There are two separate rules.","When i equals k, the value must be 1.","When i differs from k, the value must be 0."],"explanation":"An identity matrix has ones on its main diagonal and zeros everywhere else."},{"id":"A28","topic":"Arrays","subtopic":"2D arrays · diagonal matrix","difficulty":"Medium","title":"Check diagonal matrix","statement":"A square matrix is diagonal if every element outside its main diagonal is zero. Check the matrix.","inputFormat":"N followed by an N by N matrix.","outputFormat":"Print YES or NO.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"3\n2 0 0\n0 5 0\n0 0 9\n","output":"YES"},{"input":"2\n4 0\n0 8\n","output":"YES"}],"tests":[{"input":"2\n4 0\n0 8\n","expected":"YES"},{"input":"2\n4 1\n0 8\n","expected":"NO"},{"input":"3\n2 0 0\n0 5 0\n0 0 9\n","expected":"YES"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100][100],ok=1; cin >> n; for(int i=0;i<n;i++) for(int k=0;k<n;k++) cin >> a[i][k];\n    for(int i=0;i<n;i++) for(int k=0;k<n;k++) if(i!=k && a[i][k]!=0) ok=0;\n    cout << (ok ? \"YES\" : \"NO\"); return 0;\n}","hints":["Diagonal elements may be any value.","Only positions where i is not equal to k must be zero.","Ignore the main diagonal while checking."],"explanation":"The diagonal matrix condition does not require diagonal values to be 1."},{"id":"A29","topic":"Arrays","subtopic":"2D arrays · upper triangular","difficulty":"Medium","title":"Check upper triangular matrix","statement":"Check whether a square matrix is upper triangular. All entries below the main diagonal must be zero.","inputFormat":"N followed by an N by N matrix.","outputFormat":"Print YES or NO.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"3\n1 2 3\n0 4 5\n0 0 6\n","output":"YES"},{"input":"2\n1 2\n0 3\n","output":"YES"}],"tests":[{"input":"2\n1 2\n0 3\n","expected":"YES"},{"input":"2\n1 2\n4 3\n","expected":"NO"},{"input":"3\n1 2 3\n0 4 5\n0 0 6\n","expected":"YES"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100][100],ok=1; cin >> n; for(int i=0;i<n;i++) for(int k=0;k<n;k++) cin >> a[i][k];\n    for(int i=1;i<n;i++) for(int k=0;k<i;k++) if(a[i][k]!=0) ok=0;\n    cout << (ok ? \"YES\" : \"NO\"); return 0;\n}","hints":["Below the main diagonal means row index is greater than column index.","Check positions where i > k.","Any nonzero value in those positions makes the answer NO."],"explanation":"Only elements strictly below the main diagonal are constrained to zero."},{"id":"A30","topic":"Arrays","subtopic":"2D arrays · lower triangular","difficulty":"Medium","title":"Check lower triangular matrix","statement":"Check whether a square matrix is lower triangular. All entries above the main diagonal must be zero.","inputFormat":"N followed by an N by N matrix.","outputFormat":"Print YES or NO.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"3\n1 0 0\n2 3 0\n4 5 6\n","output":"YES"},{"input":"2\n1 0\n2 3\n","output":"YES"}],"tests":[{"input":"2\n1 0\n2 3\n","expected":"YES"},{"input":"2\n1 7\n2 3\n","expected":"NO"},{"input":"3\n1 0 0\n2 3 0\n4 5 6\n","expected":"YES"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100][100],ok=1; cin >> n; for(int i=0;i<n;i++) for(int k=0;k<n;k++) cin >> a[i][k];\n    for(int i=0;i<n;i++) for(int k=i+1;k<n;k++) if(a[i][k]!=0) ok=0;\n    cout << (ok ? \"YES\" : \"NO\"); return 0;\n}","hints":["Above the main diagonal means column index is greater than row index.","Check positions where k > i.","Any nonzero value there makes the matrix invalid."],"explanation":"Only elements strictly above the main diagonal must be zero."},{"id":"A31","topic":"Arrays","subtopic":"2D arrays · symmetric matrix","difficulty":"Medium","title":"Check symmetric matrix","statement":"A square matrix is symmetric when A[i][k] equals A[k][i] for every pair of indices. Check the matrix.","inputFormat":"N followed by an N by N matrix.","outputFormat":"Print YES or NO.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"3\n1 2 3\n2 4 5\n3 5 6\n","output":"YES"},{"input":"2\n1 2\n2 3\n","output":"YES"}],"tests":[{"input":"2\n1 2\n2 3\n","expected":"YES"},{"input":"2\n1 2\n3 4\n","expected":"NO"},{"input":"3\n1 2 3\n2 4 5\n3 5 6\n","expected":"YES"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[100][100],ok=1; cin >> n; for(int i=0;i<n;i++) for(int k=0;k<n;k++) cin >> a[i][k];\n    for(int i=0;i<n;i++) for(int k=0;k<n;k++) if(a[i][k]!=a[k][i]) ok=0;\n    cout << (ok ? \"YES\" : \"NO\"); return 0;\n}","hints":["Compare each element with its transposed position.","A[i][k] must equal A[k][i].","The diagonal compares with itself; other positions must match in pairs."],"explanation":"A symmetric matrix equals its transpose."},{"id":"A32","topic":"Arrays","subtopic":"2D arrays · search","difficulty":"Easy","title":"Search an element in a matrix","statement":"Search for a target in a matrix. Print its first zero-based row and column. If absent, print -1.","inputFormat":"Rows, columns, matrix values, then target.","outputFormat":"Print row and column, or -1.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2 3\n1 2 3\n4 5 6\n5\n","output":"1 1"},{"input":"2 2\n1 2\n3 4\n9\n","output":"-1"}],"tests":[{"input":"2 2\n1 2\n3 4\n9\n","expected":"-1"},{"input":"2 2\n7 8\n7 9\n7\n","expected":"0 0"},{"input":"2 3\n1 2 3\n4 5 6\n5\n","expected":"1 1"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int r,c,a[100][100],target,rr=-1,cc=-1; cin >> r >> c;\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> a[i][k]; cin >> target;\n    for(int i=0;i<r && rr==-1;i++) for(int k=0;k<c;k++) if(a[i][k]==target){ rr=i; cc=k; break; }\n    if(rr==-1) cout << -1; else cout << rr << \" \" << cc; return 0;\n}","hints":["Traverse row by row.","Store both indices when the first match is found.","Stop searching after the first occurrence."],"explanation":"Nested loops preserve row-major order, so the first match is returned."},{"id":"P01","topic":"Pointers","subtopic":"Pointer basics · dereferencing","difficulty":"Easy","title":"Double a value using a pointer","statement":"Read an integer, use a pointer to double the value stored in the variable, and print the updated value.","inputFormat":"A single integer.","outputFormat":"The doubled integer.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"7\n","output":"14"},{"input":"0\n","output":"0"}],"tests":[{"input":"0\n","expected":"0"},{"input":"-6\n","expected":"-12"},{"input":"7\n","expected":"14"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int value; cin >> value; int *p=&value;\n    *p = *p * 2;\n    cout << value; return 0;\n}","hints":["A pointer stores the address of a variable.","Use &value to initialize the pointer.","Dereference p with *p to update the original value."],"explanation":"Changing *p changes the variable whose address p stores."},{"id":"P02","topic":"Pointers","subtopic":"Pointers · swapping","difficulty":"Easy","title":"Swap two values using pointers","statement":"Write a function that swaps two integers using pointer parameters. Print the values after swapping.","inputFormat":"Two integers.","outputFormat":"The swapped values separated by a space.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4 9\n","output":"9 4"},{"input":"1 1\n","output":"1 1"}],"tests":[{"input":"1 1\n","expected":"1 1"},{"input":"-3 8\n","expected":"8 -3"},{"input":"4 9\n","expected":"9 4"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nvoid swapValues(int *a,int *b){ int temp=*a; *a=*b; *b=temp; }\nint main(){ int a,b; cin >> a >> b; swapValues(&a,&b); cout << a << \" \" << b; return 0; }","hints":["Pass the addresses of both variables.","Inside the function, use *a and *b to access values.","Save one value in temp before overwriting it."],"explanation":"Pointer parameters let the function modify the caller variables directly."},{"id":"P03","topic":"Pointers","subtopic":"Pointers · array traversal","difficulty":"Easy","title":"Sum an array using pointer arithmetic","statement":"Read an array and calculate its sum using pointer arithmetic rather than arr[i].","inputFormat":"N followed by N integers.","outputFormat":"The sum.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n3 5 2 7\n","output":"17"},{"input":"1\n-4\n","output":"-4"}],"tests":[{"input":"1\n-4\n","expected":"-4"},{"input":"3\n1 2 3\n","expected":"6"},{"input":"4\n3 5 2 7\n","expected":"17"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,arr[1000],sum=0; cin >> n; for(int i=0;i<n;i++) cin >> arr[i];\n    int *p=arr; for(int i=0;i<n;i++) sum += *(p+i);\n    cout << sum; return 0;\n}","hints":["The array name can be used as a pointer to its first element.","Move to the next element with p+i.","Read the value at that address using *(p+i)."],"explanation":"Pointer arithmetic advances by elements of the pointed-to type."},{"id":"P04","topic":"Pointers","subtopic":"Pointers · maximum","difficulty":"Medium","title":"Find maximum using a pointer","statement":"Find the largest array element by traversing the array through a pointer. Negative values are allowed.","inputFormat":"N followed by N integers.","outputFormat":"The maximum element.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n-8 -2 -5 -9\n","output":"-2"},{"input":"3\n1 9 4\n","output":"9"}],"tests":[{"input":"3\n1 9 4\n","expected":"9"},{"input":"3\n-8 -2 -5\n","expected":"-2"},{"input":"4\n-8 -2 -5 -9\n","expected":"-2"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,arr[1000]; cin >> n; for(int i=0;i<n;i++) cin >> arr[i];\n    int *p=arr; int largest=*p;\n    for(int i=1;i<n;i++) if(*(p+i)>largest) largest=*(p+i);\n    cout << largest; return 0;\n}","hints":["Initialize from the first pointed-to element.","Use *(p+i) to visit each value.","Update largest when the pointed-to value is greater."],"explanation":"The pointer is used for traversal while largest stores the current maximum."},{"id":"P05","topic":"Pointers","subtopic":"Pointers · counting","difficulty":"Easy","title":"Count positive values using a pointer","statement":"Count positive elements in an array using pointer arithmetic. Zero is not positive.","inputFormat":"N followed by N integers.","outputFormat":"The positive count.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n-1 0 4 8 -3\n","output":"2"},{"input":"3\n0 -1 -2\n","output":"0"}],"tests":[{"input":"3\n0 -1 -2\n","expected":"0"},{"input":"4\n1 2 3 4\n","expected":"4"},{"input":"5\n-1 0 4 8 -3\n","expected":"2"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,arr[1000],count=0; cin >> n; for(int i=0;i<n;i++) cin >> arr[i];\n    int *p=arr; for(int i=0;i<n;i++) if(*(p+i)>0) count++;\n    cout << count; return 0;\n}","hints":["Point p at the first array element.","Traverse using *(p+i).","Count only values strictly greater than zero."],"explanation":"A pointer-based traversal uses the same comparison as an indexed traversal."},{"id":"P06","topic":"Pointers","subtopic":"Pointers · reversal","difficulty":"Medium","title":"Reverse an array using pointers","statement":"Reverse an array in place using two pointers, one at the beginning and one at the end.","inputFormat":"N followed by N integers.","outputFormat":"The reversed array.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n1 2 3 4 5\n","output":"5 4 3 2 1"},{"input":"1\n6\n","output":"6"}],"tests":[{"input":"1\n6\n","expected":"6"},{"input":"4\n9 3 2 1\n","expected":"1 2 3 9"},{"input":"5\n1 2 3 4 5\n","expected":"5 4 3 2 1"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,arr[1000]; cin >> n; for(int i=0;i<n;i++) cin >> arr[i];\n    int *left=arr, *right=arr+n-1;\n    while(left<right){ int temp=*left; *left=*right; *right=temp; left++; right--; }\n    for(int i=0;i<n;i++) cout << arr[i] << (i+1<n ? \" \" : \"\"); return 0;\n}","hints":["Use two pointers at opposite ends.","Swap the values they point to.","Move left forward and right backward until they meet."],"explanation":"Two-pointer reversal performs only N/2 swaps."},{"id":"P07","topic":"Pointers","subtopic":"Pointers · copying arrays","difficulty":"Easy","title":"Copy an array using pointers","statement":"Copy N integers from one array into another using pointer arithmetic, then print the copied array.","inputFormat":"N followed by N integers.","outputFormat":"The copied array.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n2 4 6 8\n","output":"2 4 6 8"},{"input":"1\n5\n","output":"5"}],"tests":[{"input":"1\n5\n","expected":"5"},{"input":"3\n-1 0 7\n","expected":"-1 0 7"},{"input":"4\n2 4 6 8\n","expected":"2 4 6 8"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[1000],b[1000]; cin >> n; for(int i=0;i<n;i++) cin >> a[i];\n    int *p=a,*q=b; for(int i=0;i<n;i++) *(q+i)=*(p+i);\n    for(int i=0;i<n;i++) cout << b[i] << (i+1<n ? \" \" : \"\"); return 0;\n}","hints":["Use one pointer for the source and one for the destination.","Read each source value by dereferencing p+i.","Assign it to q+i."],"explanation":"The source and destination arrays have separate memory locations."},{"id":"P08","topic":"Pointers","subtopic":"Pointers · pointer to pointer","difficulty":"Medium","title":"Update a value using pointer to pointer","statement":"Read an integer. Use an int pointer and an int pointer-to-pointer to increase the original value by 5.","inputFormat":"A single integer.","outputFormat":"The updated integer.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"10\n","output":"15"},{"input":"0\n","output":"5"}],"tests":[{"input":"0\n","expected":"5"},{"input":"-8\n","expected":"-3"},{"input":"10\n","expected":"15"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int value; cin >> value; int *p=&value; int **pp=&p;\n    **pp = **pp + 5;\n    cout << value; return 0;\n}","hints":["First create a pointer to value.","A pointer-to-pointer stores the address of a pointer.","Use **pp to reach the original integer."],"explanation":"The two dereference operators follow pp to p and then to value."},{"id":"P09","topic":"Pointers","subtopic":"Pointers · functions","difficulty":"Medium","title":"Calculate sum and maximum through pointer parameters","statement":"Create a function that receives an array pointer and its size, then writes the sum and maximum through output pointers.","inputFormat":"N followed by N integers.","outputFormat":"Print sum and maximum.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n2 7 -1 5\n","output":"13 7"},{"input":"1\n-4\n","output":"-4 -4"}],"tests":[{"input":"1\n-4\n","expected":"-4 -4"},{"input":"3\n1 2 3\n","expected":"6 3"},{"input":"4\n2 7 -1 5\n","expected":"13 7"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nvoid calculate(int *arr,int n,int *sum,int *largest){\n    *sum=0; *largest=*arr;\n    for(int i=0;i<n;i++){ *sum += *(arr+i); if(*(arr+i)>*largest) *largest=*(arr+i); }\n}\nint main(){ int n,a[1000],sum,largest; cin >> n; for(int i=0;i<n;i++) cin >> a[i]; calculate(a,n,&sum,&largest); cout << sum << \" \" << largest; return 0; }","hints":["Pass the array as a pointer.","Pass the addresses of sum and largest so the function can update them.","Initialize largest from the first element."],"explanation":"Output parameters let one function return multiple computed values."},{"id":"P10","topic":"Pointers","subtopic":"Pointers · min-max difference","difficulty":"Easy","title":"Difference between maximum and minimum using pointers","statement":"Find the maximum and minimum values using pointer traversal and print max-min.","inputFormat":"N followed by N integers.","outputFormat":"The difference max minus min.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n7 -2 4 10 1\n","output":"12"},{"input":"1\n6\n","output":"0"}],"tests":[{"input":"1\n6\n","expected":"0"},{"input":"3\n-5 -1 -9\n","expected":"8"},{"input":"5\n7 -2 4 10 1\n","expected":"12"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[1000]; cin >> n; for(int i=0;i<n;i++) cin >> a[i];\n    int *p=a, mx=*p, mn=*p;\n    for(int i=1;i<n;i++){ if(*(p+i)>mx) mx=*(p+i); if(*(p+i)<mn) mn=*(p+i); }\n    cout << mx-mn; return 0;\n}","hints":["Initialize both candidates from the first element.","Traverse using *(p+i).","Print maximum minus minimum."],"explanation":"The pointer only changes how values are accessed; the min/max comparisons are unchanged."},{"id":"P11","topic":"Pointers","subtopic":"Pointers · searching","difficulty":"Easy","title":"Search an array using a pointer","statement":"Search for target using pointer arithmetic and print its first zero-based index, or -1.","inputFormat":"N, array values, then target.","outputFormat":"First index or -1.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n8 3 9 3\n3\n","output":"1"},{"input":"3\n1 2 3\n7\n","output":"-1"}],"tests":[{"input":"3\n1 2 3\n7\n","expected":"-1"},{"input":"4\n8 3 9 3\n3\n","expected":"1"},{"input":"1\n5\n5\n","expected":"0"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[1000],target; cin >> n; for(int i=0;i<n;i++) cin >> a[i]; cin >> target;\n    int *p=a, pos=-1; for(int i=0;i<n;i++) if(*(p+i)==target){ pos=i; break; }\n    cout << pos; return 0;\n}","hints":["Use a pointer to the first element.","Compare each dereferenced element with target.","Stop on the first match."],"explanation":"Pointer arithmetic can replace array indexing in a linear search."},{"id":"P12","topic":"Pointers","subtopic":"Pointers · sorting","difficulty":"Medium","title":"Sort an array using pointer arithmetic","statement":"Sort N integers in ascending order using selection sort, accessing elements through pointer arithmetic.","inputFormat":"N followed by N integers.","outputFormat":"The sorted array.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n9 1 5 2\n","output":"1 2 5 9"},{"input":"3\n3 1 2\n","output":"1 2 3"}],"tests":[{"input":"3\n3 1 2\n","expected":"1 2 3"},{"input":"4\n-1 5 0 2\n","expected":"-1 0 2 5"},{"input":"4\n9 1 5 2\n","expected":"1 2 5 9"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,a[1000]; cin >> n; for(int i=0;i<n;i++) cin >> a[i]; int *p=a;\n    for(int i=0;i<n-1;i++){ int min=i; for(int k=i+1;k<n;k++) if(*(p+k)<*(p+min)) min=k; int temp=*(p+i); *(p+i)=*(p+min); *(p+min)=temp; }\n    for(int i=0;i<n;i++) cout << *(p+i) << (i+1<n ? \" \" : \"\"); return 0;\n}","hints":["Use selection sort as usual.","Replace a[index] with *(p+index).","Swap through the dereferenced pointer expressions."],"explanation":"The sort algorithm is unchanged; only the access syntax uses pointers."},{"id":"M01","topic":"Dynamic Memory Allocation","subtopic":"Dynamic 1D array · sum","difficulty":"Easy","title":"Sum of a dynamically allocated array","statement":"Allocate an integer array dynamically using new[], read N values, print their sum, and release the memory.","inputFormat":"N followed by N integers.","outputFormat":"The sum.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n2 3 5 7\n","output":"17"},{"input":"1\n-9\n","output":"-9"}],"tests":[{"input":"1\n-9\n","expected":"-9"},{"input":"3\n1 1 1\n","expected":"3"},{"input":"4\n2 3 5 7\n","expected":"17"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n; cin >> n; int *p=new int[n]; int sum=0;\n    for(int i=0;i<n;i++){ cin >> p[i]; sum += p[i]; }\n    cout << sum; delete[] p; return 0;\n}","hints":["Allocate n integers with new int[n].","Use the allocated block like an array.","Release an array allocation with delete[]."],"explanation":"Dynamic arrays are stored on the heap and should be freed with delete[]."},{"id":"M02","topic":"Dynamic Memory Allocation","subtopic":"Dynamic 1D array · average","difficulty":"Easy","title":"Average of a dynamically allocated array","statement":"Dynamically allocate an array, read its elements and print the average.","inputFormat":"N followed by N integers.","outputFormat":"The average using default floating-point formatting.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"3\n2 4 6\n","output":"4"},{"input":"1\n5\n","output":"5"}],"tests":[{"input":"1\n5\n","expected":"5"},{"input":"3\n1 2 2\n","expected":"1.66667"},{"input":"3\n2 4 6\n","expected":"4"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,sum=0; cin >> n; int *p=new int[n];\n    for(int i=0;i<n;i++){ cin >> p[i]; sum += p[i]; }\n    cout << (double)sum/n; delete[] p; return 0;\n}","hints":["Allocate enough space for n integers.","Compute the sum while reading values.","Cast to double before division and then delete[] the array."],"explanation":"The average can be fractional, so use floating-point division."},{"id":"M03","topic":"Dynamic Memory Allocation","subtopic":"Dynamic 1D array · min and max","difficulty":"Medium","title":"Minimum and maximum in a dynamic array","statement":"Allocate an array dynamically and print its minimum and maximum values.","inputFormat":"N followed by N integers.","outputFormat":"Minimum followed by maximum.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n-4 8 2 11 3\n","output":"-4 11"},{"input":"3\n-9 -2 -7\n","output":"-9 -2"}],"tests":[{"input":"3\n-9 -2 -7\n","expected":"-9 -2"},{"input":"1\n6\n","expected":"6 6"},{"input":"5\n-4 8 2 11 3\n","expected":"-4 11"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n; cin >> n; int *p=new int[n]; for(int i=0;i<n;i++) cin >> p[i];\n    int mn=p[0],mx=p[0]; for(int i=1;i<n;i++){ if(p[i]<mn) mn=p[i]; if(p[i]>mx) mx=p[i]; }\n    cout << mn << \" \" << mx; delete[] p; return 0;\n}","hints":["Use new[] for the dynamic array.","Initialize both min and max from p[0].","Compare every remaining value and release the array with delete[]."],"explanation":"Starting with the first actual value handles all-negative and all-positive arrays."},{"id":"M04","topic":"Dynamic Memory Allocation","subtopic":"Dynamic 1D array · reversal","difficulty":"Medium","title":"Reverse a dynamically allocated array","statement":"Allocate an array dynamically, reverse its contents in place and print it.","inputFormat":"N followed by N integers.","outputFormat":"The reversed array.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n2 4 6 8\n","output":"8 6 4 2"},{"input":"1\n9\n","output":"9"}],"tests":[{"input":"1\n9\n","expected":"9"},{"input":"3\n1 2 3\n","expected":"3 2 1"},{"input":"4\n2 4 6 8\n","expected":"8 6 4 2"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n; cin >> n; int *p=new int[n]; for(int i=0;i<n;i++) cin >> p[i];\n    for(int i=0;i<n/2;i++){ int temp=p[i]; p[i]=p[n-1-i]; p[n-1-i]=temp; }\n    for(int i=0;i<n;i++) cout << p[i] << (i+1<n ? \" \" : \"\");\n    delete[] p; return 0;\n}","hints":["Use new int[n] to allocate the array.","Swap symmetric positions only up to n/2.","Call delete[] when finished."],"explanation":"An in-place reversal uses paired swaps and no second array."},{"id":"M05","topic":"Dynamic Memory Allocation","subtopic":"Dynamic 1D array · search","difficulty":"Easy","title":"Search a dynamically allocated array","statement":"Allocate an array dynamically and find the first zero-based index of target.","inputFormat":"N, N integers, then target.","outputFormat":"Index or -1.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n4 2 9 2 1\n2\n","output":"1"},{"input":"3\n1 3 5\n2\n","output":"-1"}],"tests":[{"input":"3\n1 3 5\n2\n","expected":"-1"},{"input":"5\n4 2 9 2 1\n2\n","expected":"1"},{"input":"1\n8\n8\n","expected":"0"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,target; cin >> n; int *p=new int[n]; for(int i=0;i<n;i++) cin >> p[i]; cin >> target;\n    int pos=-1; for(int i=0;i<n;i++) if(p[i]==target){ pos=i; break; }\n    cout << pos; delete[] p; return 0;\n}","hints":["Allocate and fill the dynamic array.","Perform a left-to-right search.","Free the memory after printing the answer."],"explanation":"The search algorithm is the same for stack arrays and dynamically allocated arrays."},{"id":"M06","topic":"Dynamic Memory Allocation","subtopic":"Dynamic 2D arrays · sum","difficulty":"Medium","title":"Sum a dynamic matrix","statement":"Allocate a rows by columns matrix as one contiguous block, read values and print the total sum. Access it using row-major pointer arithmetic.","inputFormat":"Rows and columns followed by matrix values row-wise.","outputFormat":"The sum of all matrix elements.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2 3\n1 2 3\n4 5 6\n","output":"21"},{"input":"1 1\n-5\n","output":"-5"}],"tests":[{"input":"1 1\n-5\n","expected":"-5"},{"input":"2 2\n1 1\n1 1\n","expected":"4"},{"input":"2 3\n1 2 3\n4 5 6\n","expected":"21"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int r,c,sum=0; cin >> r >> c; int *p=new int[r*c];\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++){ cin >> *(p+i*c+k); sum += *(p+i*c+k); }\n    cout << sum; delete[] p; return 0;\n}","hints":["Allocate r*c integers in one contiguous block.","The row-major offset is i*c+k.","Delete the one allocated block with delete[]."],"explanation":"Contiguous 2D storage maps element [i][k] to p+i*c+k."},{"id":"M07","topic":"Dynamic Memory Allocation","subtopic":"Dynamic 2D arrays · addition","difficulty":"Medium","title":"Add dynamically allocated matrices","statement":"Dynamically allocate two matrices, add corresponding elements and print the result. Use pointer-to-pointer allocation.","inputFormat":"Rows and columns followed by matrices A and B.","outputFormat":"The sum matrix.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2 2\n1 2\n3 4\n5 6\n7 8\n","output":"6 8\n10 12"},{"input":"1 2\n1 2\n3 4\n","output":"4 6"}],"tests":[{"input":"1 2\n1 2\n3 4\n","expected":"4 6"},{"input":"2 1\n1\n2\n3\n4\n","expected":"4\n6"},{"input":"2 2\n1 2\n3 4\n5 6\n7 8\n","expected":"6 8\n10 12"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int r,c; cin >> r >> c;\n    int **a=new int*[r], **b=new int*[r];\n    for(int i=0;i<r;i++){ a[i]=new int[c]; b[i]=new int[c]; }\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> a[i][k];\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> b[i][k];\n    for(int i=0;i<r;i++){ for(int k=0;k<c;k++) cout << a[i][k]+b[i][k] << (k+1<c ? \" \" : \"\"); if(i+1<r) cout << \"\\n\"; }\n    for(int i=0;i<r;i++){ delete[] a[i]; delete[] b[i]; } delete[] a; delete[] b; return 0;\n}","hints":["Allocate row-pointer arrays first, then each row.","Read both matrices and add matching positions.","Delete every row before deleting the pointer arrays."],"explanation":"Each row is a separate allocation, so each must be released before its row-pointer array."},{"id":"M08","topic":"Dynamic Memory Allocation","subtopic":"Dynamic 2D arrays · multiplication","difficulty":"Hard","title":"Multiply dynamically allocated matrices","statement":"Multiply two dynamically allocated matrices A and B. The dimensions are compatible. Use pointer-to-pointer allocation.","inputFormat":"r1 c1, matrix A, r2 c2, matrix B.","outputFormat":"Product matrix.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2 2\n1 2\n3 4\n2 2\n5 6\n7 8\n","output":"19 22\n43 50"},{"input":"1 2\n1 2\n2 1\n3\n4\n","output":"11"}],"tests":[{"input":"1 2\n1 2\n2 1\n3\n4\n","expected":"11"},{"input":"2 1\n2\n3\n1 2\n4 5\n","expected":"8 10\n12 15"},{"input":"2 2\n1 2\n3 4\n2 2\n5 6\n7 8\n","expected":"19 22\n43 50"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int r1,c1,r2,c2; cin >> r1 >> c1;\n    int **a=new int*[r1]; for(int i=0;i<r1;i++) a[i]=new int[c1];\n    for(int i=0;i<r1;i++) for(int k=0;k<c1;k++) cin >> a[i][k];\n    cin >> r2 >> c2; int **b=new int*[r2]; for(int i=0;i<r2;i++) b[i]=new int[c2];\n    for(int i=0;i<r2;i++) for(int k=0;k<c2;k++) cin >> b[i][k];\n    int **out=new int*[r1]; for(int i=0;i<r1;i++) out[i]=new int[c2];\n    for(int i=0;i<r1;i++) for(int k=0;k<c2;k++){ out[i][k]=0; for(int t=0;t<c1;t++) out[i][k]+=a[i][t]*b[t][k]; }\n    for(int i=0;i<r1;i++){ for(int k=0;k<c2;k++) cout << out[i][k] << (k+1<c2 ? \" \" : \"\"); if(i+1<r1) cout << \"\\n\"; }\n    for(int i=0;i<r1;i++){ delete[] a[i]; delete[] out[i]; } for(int i=0;i<r2;i++) delete[] b[i];\n    delete[] a; delete[] b; delete[] out; return 0;\n}","hints":["Allocate A, B and the result with their correct dimensions.","Each result cell sums c1 products.","Release every allocated row and each pointer array."],"explanation":"The result dimensions are r1 by c2; the inner multiplication dimension is c1."},{"id":"M09","topic":"Dynamic Memory Allocation","subtopic":"Dynamic 2D arrays · contiguous storage","difficulty":"Medium","title":"Row sums using contiguous dynamic memory","statement":"Allocate a matrix in one contiguous block and print each row sum using pointer arithmetic.","inputFormat":"Rows and columns followed by matrix values.","outputFormat":"One row sum per line.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2 3\n1 2 3\n4 5 6\n","output":"6\n15"},{"input":"1 2\n5 7\n","output":"12"}],"tests":[{"input":"1 2\n5 7\n","expected":"12"},{"input":"3 1\n2\n3\n4\n","expected":"2\n3\n4"},{"input":"2 3\n1 2 3\n4 5 6\n","expected":"6\n15"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int r,c; cin >> r >> c; int *p=new int[r*c];\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> *(p+i*c+k);\n    for(int i=0;i<r;i++){ int sum=0; for(int k=0;k<c;k++) sum += *(p+i*c+k); cout << sum; if(i+1<r) cout << \"\\n\"; }\n    delete[] p; return 0;\n}","hints":["Allocate r*c integers.","The first element of row i has offset i*c.","Sum c values starting at that offset."],"explanation":"Contiguous row-major allocation keeps all rows in one block."},{"id":"M10","topic":"Dynamic Memory Allocation","subtopic":"Dynamic 1D array · insertion","difficulty":"Medium","title":"Insert into a dynamic array","statement":"Read a dynamically allocated array, insert a value at a zero-based position by creating a new array, then free the old allocation.","inputFormat":"N, N integers, then position and value.","outputFormat":"The updated array.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n1 2 3 4\n2 9\n","output":"1 2 9 3 4"},{"input":"2\n4 5\n0 3\n","output":"3 4 5"}],"tests":[{"input":"2\n4 5\n0 3\n","expected":"3 4 5"},{"input":"2\n4 5\n2 3\n","expected":"4 5 3"},{"input":"4\n1 2 3 4\n2 9\n","expected":"1 2 9 3 4"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,pos,value; cin >> n; int *p=new int[n]; for(int i=0;i<n;i++) cin >> p[i]; cin >> pos >> value;\n    int *q=new int[n+1]; for(int i=0;i<pos;i++) q[i]=p[i]; q[pos]=value;\n    for(int i=pos;i<n;i++) q[i+1]=p[i];\n    for(int i=0;i<n+1;i++) cout << q[i] << (i<n ? \" \" : \"\");\n    delete[] p; delete[] q; return 0;\n}","hints":["Create a new block with n+1 positions.","Copy elements before pos, place value at pos, then copy the rest one index later.","Release both arrays after printing."],"explanation":"Using a second block avoids shifting beyond the original allocation."},{"id":"F01","topic":"Functions","subtopic":"Functions · prime checking","difficulty":"Easy","title":"Prime check using a function","statement":"Write a function isPrime(int n) that returns whether n is prime. Print YES or NO.","inputFormat":"A single integer n.","outputFormat":"YES if prime, otherwise NO.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"17\n","output":"YES"},{"input":"1\n","output":"NO"}],"tests":[{"input":"1\n","expected":"NO"},{"input":"2\n","expected":"YES"},{"input":"17\n","expected":"YES"},{"input":"25\n","expected":"NO"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint isPrime(int n){\n    if(n<2) return 0;\n    for(int i=2;i*i<=n;i++) if(n%i==0) return 0;\n    return 1;\n}\nint main(){ int n; cin >> n; cout << (isPrime(n) ? \"YES\" : \"NO\"); return 0; }","hints":["A prime number is at least 2.","Check possible divisors starting at 2.","A divisor up to the square root is sufficient."],"explanation":"The function returns 0 for non-prime values and 1 for prime values."},{"id":"F02","topic":"Functions","subtopic":"Functions · GCD","difficulty":"Easy","title":"Find GCD using a function","statement":"Write a function that returns the greatest common divisor of two non-negative integers.","inputFormat":"Two integers a and b.","outputFormat":"The GCD.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"24 36\n","output":"12"},{"input":"7 13\n","output":"1"}],"tests":[{"input":"7 13\n","expected":"1"},{"input":"0 5\n","expected":"5"},{"input":"24 36\n","expected":"12"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint gcdValue(int a,int b){ while(b!=0){ int temp=b; b=a%b; a=temp; } return a; }\nint main(){ int a,b; cin >> a >> b; cout << gcdValue(a,b); return 0; }","hints":["Use the Euclidean algorithm.","Replace (a,b) with (b,a%b).","Stop when b becomes zero."],"explanation":"The final nonzero value of a is the greatest common divisor."},{"id":"F03","topic":"Functions","subtopic":"Functions · arrays","difficulty":"Easy","title":"Array sum using a function","statement":"Create a function sumArray that receives an integer array and its size and returns the sum.","inputFormat":"N followed by N integers.","outputFormat":"The sum.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n2 5 1 4\n","output":"12"},{"input":"1\n-2\n","output":"-2"}],"tests":[{"input":"1\n-2\n","expected":"-2"},{"input":"3\n3 3 3\n","expected":"9"},{"input":"4\n2 5 1 4\n","expected":"12"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint sumArray(int arr[],int n){ int sum=0; for(int i=0;i<n;i++) sum+=arr[i]; return sum; }\nint main(){ int n,a[1000]; cin >> n; for(int i=0;i<n;i++) cin >> a[i]; cout << sumArray(a,n); return 0; }","hints":["Pass both the array and its size.","The function uses a loop to accumulate values.","Return the final sum."],"explanation":"A function parameter written as int arr[] receives access to the original array elements."},{"id":"F04","topic":"Functions","subtopic":"Functions · arrays","difficulty":"Easy","title":"Largest array element using a function","statement":"Write a function that receives an array and its size and returns the largest element.","inputFormat":"N followed by N integers.","outputFormat":"The largest element.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n-5 4 9 1 0\n","output":"9"},{"input":"3\n-8 -2 -5\n","output":"-2"}],"tests":[{"input":"3\n-8 -2 -5\n","expected":"-2"},{"input":"1\n11\n","expected":"11"},{"input":"5\n-5 4 9 1 0\n","expected":"9"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint largestValue(int arr[],int n){ int mx=arr[0]; for(int i=1;i<n;i++) if(arr[i]>mx) mx=arr[i]; return mx; }\nint main(){ int n,a[1000]; cin >> n; for(int i=0;i<n;i++) cin >> a[i]; cout << largestValue(a,n); return 0; }","hints":["The function needs the array and its length.","Initialize the maximum from arr[0].","Return the largest value after one traversal."],"explanation":"The function encapsulates the maximum-search logic for reuse."},{"id":"F05","topic":"Functions","subtopic":"Functions · searching","difficulty":"Medium","title":"Linear search using a function","statement":"Write a function that returns the first zero-based position of target in an array, or -1 if absent.","inputFormat":"N, array values, target.","outputFormat":"The returned position.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n2 9 4 9 1\n9\n","output":"1"},{"input":"3\n1 2 3\n4\n","output":"-1"}],"tests":[{"input":"3\n1 2 3\n4\n","expected":"-1"},{"input":"1\n7\n7\n","expected":"0"},{"input":"5\n2 9 4 9 1\n9\n","expected":"1"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint linearSearch(int arr[],int n,int target){ for(int i=0;i<n;i++) if(arr[i]==target) return i; return -1; }\nint main(){ int n,a[1000],target; cin >> n; for(int i=0;i<n;i++) cin >> a[i]; cin >> target; cout << linearSearch(a,n,target); return 0; }","hints":["Return immediately when the first match is found.","If the loop finishes, the target was absent.","Use -1 as the not-found result."],"explanation":"The function returns an index rather than printing from inside the search."},{"id":"F06","topic":"Functions","subtopic":"Functions · sorting","difficulty":"Medium","title":"Bubble sort using a function","statement":"Write a function bubbleSort that sorts an array in ascending order. Print the sorted array from main.","inputFormat":"N followed by N integers.","outputFormat":"The sorted array.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n5 1 4 2 8\n","output":"1 2 4 5 8"},{"input":"2\n2 1\n","output":"1 2"}],"tests":[{"input":"2\n2 1\n","expected":"1 2"},{"input":"4\n-1 4 0 3\n","expected":"-1 0 3 4"},{"input":"5\n5 1 4 2 8\n","expected":"1 2 4 5 8"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nvoid bubbleSort(int arr[],int n){\n    for(int i=0;i<n-1;i++) for(int k=0;k<n-1-i;k++) if(arr[k]>arr[k+1]){ int temp=arr[k]; arr[k]=arr[k+1]; arr[k+1]=temp; }\n}\nint main(){ int n,a[1000]; cin >> n; for(int i=0;i<n;i++) cin >> a[i]; bubbleSort(a,n); for(int i=0;i<n;i++) cout << a[i] << (i+1<n ? \" \" : \"\"); return 0; }","hints":["Pass the array and n to the function.","Use adjacent comparisons inside nested loops.","The function changes the original array in place."],"explanation":"Array parameters allow the sorting function to modify the caller array."},{"id":"F07","topic":"Functions","subtopic":"Functions · matrices","difficulty":"Medium","title":"Matrix addition using a function","statement":"Write a function that adds two matrices of the same dimensions and stores the answer in a third matrix.","inputFormat":"Rows, columns, matrix A, matrix B.","outputFormat":"The resulting matrix.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2 2\n1 2\n3 4\n5 6\n7 8\n","output":"6 8\n10 12"},{"input":"1 2\n1 3\n4 5\n","output":"5 8"}],"tests":[{"input":"1 2\n1 3\n4 5\n","expected":"5 8"},{"input":"2 1\n-1\n3\n2\n4\n","expected":"1\n7"},{"input":"2 2\n1 2\n3 4\n5 6\n7 8\n","expected":"6 8\n10 12"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nvoid addMatrices(int a[][100],int b[][100],int out[][100],int r,int c){ for(int i=0;i<r;i++) for(int k=0;k<c;k++) out[i][k]=a[i][k]+b[i][k]; }\nint main(){ int r,c,a[100][100],b[100][100],out[100][100]; cin >> r >> c;\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> a[i][k];\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> b[i][k];\n    addMatrices(a,b,out,r,c);\n    for(int i=0;i<r;i++){ for(int k=0;k<c;k++) cout << out[i][k] << (k+1<c ? \" \" : \"\"); if(i+1<r) cout << \"\\n\"; } return 0;\n}","hints":["Use a function with three matrix parameters.","The function fills out[i][k] with a[i][k]+b[i][k].","Pass dimensions so the function knows the loop limits."],"explanation":"The output matrix is passed by reference through its array parameter and filled by the function."},{"id":"F08","topic":"Functions","subtopic":"Functions · prime range","difficulty":"Medium","title":"Count primes in a range using functions","statement":"Write an isPrime function and use it to count prime numbers in the inclusive range L to R.","inputFormat":"Two integers L and R.","outputFormat":"The number of primes in the inclusive range.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"10 20\n","output":"4"},{"input":"1 1\n","output":"0"}],"tests":[{"input":"1 1\n","expected":"0"},{"input":"1 10\n","expected":"4"},{"input":"10 20\n","expected":"4"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint isPrime(int n){ if(n<2) return 0; for(int i=2;i*i<=n;i++) if(n%i==0) return 0; return 1; }\nint main(){ int l,r,count=0; cin >> l >> r; for(int x=l;x<=r;x++) if(isPrime(x)) count++; cout << count; return 0; }","hints":["Reuse isPrime for each value in the range.","Check both endpoints.","Increase count when isPrime returns true."],"explanation":"Separating primality into a function makes the range loop simple."},{"id":"F09","topic":"Functions","subtopic":"Functions · even and odd","difficulty":"Easy","title":"Count even and odd values using functions","statement":"Write a function isEven(int x), then use it to count even and odd values in the input array.","inputFormat":"N followed by N integers.","outputFormat":"Even count followed by odd count.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n1 2 3 4 6\n","output":"3 2"},{"input":"3\n2 4 8\n","output":"3 0"}],"tests":[{"input":"3\n2 4 8\n","expected":"3 0"},{"input":"4\n-3 -2 0 7\n","expected":"2 2"},{"input":"5\n1 2 3 4 6\n","expected":"3 2"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint isEven(int x){ return x%2==0; }\nint main(){ int n,x,even=0,odd=0; cin >> n; for(int i=0;i<n;i++){ cin >> x; if(isEven(x)) even++; else odd++; } cout << even << \" \" << odd; return 0; }","hints":["Create a small function that returns whether x is divisible by 2.","Call it once for each element.","Update the even or odd counter."],"explanation":"A helper function keeps the condition reusable and easy to test."},{"id":"R01","topic":"Functions and Recursion","subtopic":"Recursion · ascending print","difficulty":"Easy","title":"Print 1 to N using recursion","statement":"Write a recursive function that prints all integers from 1 through N in ascending order.","inputFormat":"A positive integer N.","outputFormat":"Numbers from 1 to N separated by spaces.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n","output":"1 2 3 4 5"},{"input":"1\n","output":"1"}],"tests":[{"input":"1\n","expected":"1"},{"input":"3\n","expected":"1 2 3"},{"input":"5\n","expected":"1 2 3 4 5"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nvoid printUp(int x,int n){ if(x>n) return; cout << x << (x<n ? \" \" : \"\"); printUp(x+1,n); }\nint main(){ int n; cin >> n; printUp(1,n); return 0; }","hints":["The base case stops after n.","Print the current value before making the recursive call.","Call the function with x+1."],"explanation":"Printing before the recursive call produces ascending order."},{"id":"R02","topic":"Functions and Recursion","subtopic":"Recursion · descending print","difficulty":"Easy","title":"Print N to 1 using recursion","statement":"Write a recursive function that prints N down to 1.","inputFormat":"A positive integer N.","outputFormat":"Numbers from N to 1 separated by spaces.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n","output":"5 4 3 2 1"},{"input":"1\n","output":"1"}],"tests":[{"input":"1\n","expected":"1"},{"input":"3\n","expected":"3 2 1"},{"input":"5\n","expected":"5 4 3 2 1"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nvoid printDown(int n){ if(n<1) return; cout << n << (n>1 ? \" \" : \"\"); printDown(n-1); }\nint main(){ int n; cin >> n; printDown(n); return 0; }","hints":["Stop when n becomes smaller than 1.","Print n now.","The recursive call should use n-1."],"explanation":"Printing before recursion naturally produces descending order."},{"id":"R03","topic":"Functions and Recursion","subtopic":"Recursion · summation","difficulty":"Easy","title":"Sum first N natural numbers recursively","statement":"Return the sum 1+2+...+N using recursion.","inputFormat":"A non-negative integer N.","outputFormat":"The sum.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n","output":"15"},{"input":"0\n","output":"0"}],"tests":[{"input":"0\n","expected":"0"},{"input":"1\n","expected":"1"},{"input":"5\n","expected":"15"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint sumN(int n){ if(n==0) return 0; return n+sumN(n-1); }\nint main(){ int n; cin >> n; cout << sumN(n); return 0; }","hints":["Choose a base case that returns zero.","The current n contributes to the sum.","Add sumN(n-1) to n."],"explanation":"Each call adds its argument and reduces the problem by one."},{"id":"R04","topic":"Functions and Recursion","subtopic":"Recursion · factorial","difficulty":"Easy","title":"Factorial using recursion","statement":"Calculate N factorial recursively. Define 0! as 1.","inputFormat":"A non-negative integer N, at most 12.","outputFormat":"N factorial.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n","output":"120"},{"input":"0\n","output":"1"}],"tests":[{"input":"0\n","expected":"1"},{"input":"1\n","expected":"1"},{"input":"5\n","expected":"120"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint factorial(int n){ if(n==0 || n==1) return 1; return n*factorial(n-1); }\nint main(){ int n; cin >> n; cout << factorial(n); return 0; }","hints":["The base case is 0! = 1.","For n greater than 1, multiply n by the previous factorial.","Return n * factorial(n-1)."],"explanation":"The recursive calls reduce n until the base case returns 1."},{"id":"R05","topic":"Functions and Recursion","subtopic":"Recursion · Fibonacci","difficulty":"Medium","title":"Nth Fibonacci number recursively","statement":"Use recursion to calculate the Nth Fibonacci number. The sequence is 0, 1, 1, 2, 3, 5... and indexing starts at 0.","inputFormat":"An integer N from 0 to 20.","outputFormat":"The Nth Fibonacci number.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"6\n","output":"8"},{"input":"0\n","output":"0"}],"tests":[{"input":"0\n","expected":"0"},{"input":"1\n","expected":"1"},{"input":"6\n","expected":"8"},{"input":"10\n","expected":"55"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint fibonacci(int n){ if(n==0) return 0; if(n==1) return 1; return fibonacci(n-1)+fibonacci(n-2); }\nint main(){ int n; cin >> n; cout << fibonacci(n); return 0; }","hints":["The first two values are special base cases.","Every later term is the sum of the previous two.","Return fibonacci(n-1)+fibonacci(n-2)."],"explanation":"This direct recursive definition mirrors the Fibonacci recurrence."},{"id":"R06","topic":"Functions and Recursion","subtopic":"Recursion · digit count","difficulty":"Easy","title":"Count digits recursively","statement":"Count the digits of a non-negative integer using recursion. Treat 0 as having one digit.","inputFormat":"A non-negative integer.","outputFormat":"The number of digits.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5072\n","output":"4"},{"input":"0\n","output":"1"}],"tests":[{"input":"0\n","expected":"1"},{"input":"8\n","expected":"1"},{"input":"5072\n","expected":"4"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint countDigits(int n){ if(n<10) return 1; return 1+countDigits(n/10); }\nint main(){ int n; cin >> n; cout << countDigits(n); return 0; }","hints":["Any one-digit non-negative number has one digit.","Removing the last digit uses integer division by 10.","Add one for the digit removed."],"explanation":"Repeated division by ten removes one digit per recursive call."},{"id":"R07","topic":"Functions and Recursion","subtopic":"Recursion · sum of digits","difficulty":"Easy","title":"Sum of digits recursively","statement":"Calculate the sum of the digits of a non-negative integer using recursion.","inputFormat":"A non-negative integer.","outputFormat":"The sum of its digits.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"572\n","output":"14"},{"input":"0\n","output":"0"}],"tests":[{"input":"0\n","expected":"0"},{"input":"9\n","expected":"9"},{"input":"572\n","expected":"14"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint sumDigits(int n){ if(n==0) return 0; return n%10+sumDigits(n/10); }\nint main(){ int n; cin >> n; cout << sumDigits(n); return 0; }","hints":["The last digit is n%10.","The remaining number is n/10.","Stop when n becomes zero."],"explanation":"Each call contributes one digit and then processes the remaining prefix."},{"id":"R08","topic":"Functions and Recursion","subtopic":"Recursion · reverse number","difficulty":"Medium","title":"Reverse a number recursively","statement":"Reverse the digits of a non-negative integer using recursion and a place-value parameter.","inputFormat":"A non-negative integer.","outputFormat":"The reversed integer; leading zeroes in the reversed form are not printed.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"1204\n","output":"4021"},{"input":"0\n","output":"0"}],"tests":[{"input":"0\n","expected":"0"},{"input":"7\n","expected":"7"},{"input":"1204\n","expected":"4021"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint reverseRec(int n,int rev){ if(n==0) return rev; return reverseRec(n/10,rev*10+n%10); }\nint main(){ int n; cin >> n; cout << reverseRec(n,0); return 0; }","hints":["Carry the reversed number as a parameter.","Append the last digit with rev*10+n%10.","Remove the last digit from n before the next call."],"explanation":"The accumulator rev stores the part already reversed."},{"id":"R09","topic":"Functions and Recursion","subtopic":"Recursion · largest element","difficulty":"Hard","title":"Find largest array element recursively","statement":"Write a recursive function that returns the largest element from index 0 through index n-1.","inputFormat":"N followed by N integers.","outputFormat":"The largest element.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n-4 8 2 11 3\n","output":"11"},{"input":"1\n-9\n","output":"-9"}],"tests":[{"input":"1\n-9\n","expected":"-9"},{"input":"4\n3 7 1 2\n","expected":"7"},{"input":"5\n-4 8 2 11 3\n","expected":"11"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint largestRec(int arr[],int n){ if(n==1) return arr[0]; int rest=largestRec(arr,n-1); return (arr[n-1]>rest ? arr[n-1] : rest); }\nint main(){ int n,a[1000]; cin >> n; for(int i=0;i<n;i++) cin >> a[i]; cout << largestRec(a,n); return 0; }","hints":["A one-element array is its own maximum.","Find the maximum of the first n-1 elements recursively.","Compare that result with arr[n-1]."],"explanation":"The function reduces the prefix by one element at each recursive call."},{"id":"L01","topic":"Logic Fundamentals","subtopic":"Conditions · even and odd","difficulty":"Easy","title":"Even or odd","statement":"Determine whether an integer is even or odd.","inputFormat":"One integer.","outputFormat":"Print EVEN or ODD.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"14\n","output":"EVEN"},{"input":"0\n","output":"EVEN"}],"tests":[{"input":"0\n","expected":"EVEN"},{"input":"-3\n","expected":"ODD"},{"input":"14\n","expected":"EVEN"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){ int n; cin >> n; if(n%2==0) cout << \"EVEN\"; else cout << \"ODD\"; return 0; }","hints":["An even integer is divisible by 2.","Check whether n%2 equals zero.","Handle negative values with the same remainder rule."],"explanation":"The remainder after division by two determines parity."},{"id":"L02","topic":"Logic Fundamentals","subtopic":"Loops · prime number","difficulty":"Easy","title":"Prime number check","statement":"Determine whether a positive integer is prime. A prime number has exactly two positive divisors.","inputFormat":"One integer n.","outputFormat":"Print PRIME or NOT PRIME.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"29\n","output":"PRIME"},{"input":"1\n","output":"NOT PRIME"}],"tests":[{"input":"1\n","expected":"NOT PRIME"},{"input":"2\n","expected":"PRIME"},{"input":"29\n","expected":"PRIME"},{"input":"49\n","expected":"NOT PRIME"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){ int n; cin >> n; int prime=1; if(n<2) prime=0; for(int i=2;i*i<=n;i++) if(n%i==0){ prime=0; break; } cout << (prime ? \"PRIME\" : \"NOT PRIME\"); return 0; }","hints":["Numbers smaller than 2 are not prime.","Try divisors starting at 2.","If any divisor divides n exactly, it is not prime."],"explanation":"It is enough to test divisors while i*i is no greater than n."},{"id":"L03","topic":"Logic Fundamentals","subtopic":"Loops · primes in a range","difficulty":"Medium","title":"Print prime numbers in a range","statement":"Print all prime numbers from L through R, inclusive, in ascending order.","inputFormat":"Two integers L and R.","outputFormat":"All primes in the range separated by spaces. Print NONE if there are no primes.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"10 20\n","output":"11 13 17 19"},{"input":"1 3\n","output":"2 3"}],"tests":[{"input":"1 3\n","expected":"2 3"},{"input":"14 16\n","expected":"NONE"},{"input":"10 20\n","expected":"11 13 17 19"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){ int l,r; cin >> l >> r; int printed=0;\n    for(int n=l;n<=r;n++){ int prime=(n>=2); for(int i=2;i*i<=n;i++) if(n%i==0){ prime=0; break; } if(prime){ if(printed) cout << \" \"; cout << n; printed++; } }\n    if(!printed) cout << \"NONE\"; return 0;\n}","hints":["Visit every integer from L through R.","For each number, test divisors only when it is at least 2.","Track whether any prime has been printed."],"explanation":"A prime-checking loop is nested inside the inclusive range loop."},{"id":"L04","topic":"Logic Fundamentals","subtopic":"Conditions · leap year","difficulty":"Easy","title":"Leap year check","statement":"Determine whether a year is a leap year in the Gregorian calendar.","inputFormat":"A year as an integer.","outputFormat":"Print LEAP YEAR or NOT LEAP YEAR.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2000\n","output":"LEAP YEAR"},{"input":"1900\n","output":"NOT LEAP YEAR"}],"tests":[{"input":"1900\n","expected":"NOT LEAP YEAR"},{"input":"2024\n","expected":"LEAP YEAR"},{"input":"2000\n","expected":"LEAP YEAR"},{"input":"2023\n","expected":"NOT LEAP YEAR"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){ int year; cin >> year; if(year%400==0 || (year%4==0 && year%100!=0)) cout << \"LEAP YEAR\"; else cout << \"NOT LEAP YEAR\"; return 0; }","hints":["A year divisible by 400 is a leap year.","Otherwise it must be divisible by 4 but not by 100.","Use parentheses to group the two valid cases."],"explanation":"Century years are leap years only when divisible by 400."},{"id":"L05","topic":"Logic Fundamentals","subtopic":"Loops · Armstrong number","difficulty":"Medium","title":"Armstrong number check","statement":"Check whether a non-negative integer is an Armstrong number. An n-digit number equals the sum of each digit raised to power n.","inputFormat":"A non-negative integer.","outputFormat":"Print ARMSTRONG or NOT ARMSTRONG.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"153\n","output":"ARMSTRONG"},{"input":"0\n","output":"ARMSTRONG"}],"tests":[{"input":"0\n","expected":"ARMSTRONG"},{"input":"153\n","expected":"ARMSTRONG"},{"input":"123\n","expected":"NOT ARMSTRONG"},{"input":"9474\n","expected":"ARMSTRONG"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n; cin >> n; int temp=n,digits=0;\n    do{ digits++; temp/=10; }while(temp>0);\n    temp=n; int sum=0;\n    do{ int digit=temp%10,power=1; for(int i=0;i<digits;i++) power*=digit; sum+=power; temp/=10; }while(temp>0);\n    cout << (sum==n ? \"ARMSTRONG\" : \"NOT ARMSTRONG\"); return 0;\n}","hints":["Count the digits before calculating powers.","For each digit, multiply it by itself digits times.","Add each powered digit and compare the total with the original number."],"explanation":"The digit count determines the exponent used for every digit."},{"id":"L06","topic":"Logic Fundamentals","subtopic":"Loops · palindrome number","difficulty":"Easy","title":"Palindrome number check","statement":"Check whether a non-negative integer reads the same forward and backward.","inputFormat":"A non-negative integer.","outputFormat":"Print PALINDROME or NOT PALINDROME.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"1221\n","output":"PALINDROME"},{"input":"0\n","output":"PALINDROME"}],"tests":[{"input":"0\n","expected":"PALINDROME"},{"input":"123\n","expected":"NOT PALINDROME"},{"input":"1221\n","expected":"PALINDROME"},{"input":"120\n","expected":"NOT PALINDROME"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){ int n; cin >> n; int temp=n,rev=0; while(temp>0){ rev=rev*10+temp%10; temp/=10; } cout << (rev==n ? \"PALINDROME\" : \"NOT PALINDROME\"); return 0; }","hints":["Keep the original number unchanged.","Build a reversed number using the last digit.","Compare the reversed number with the original."],"explanation":"Repeatedly taking the last digit constructs the number in reverse order."},{"id":"L07","topic":"Logic Fundamentals","subtopic":"Functions/loops · GCD and LCM","difficulty":"Medium","title":"GCD and LCM","statement":"Read two positive integers and print their greatest common divisor and least common multiple.","inputFormat":"Two positive integers a and b.","outputFormat":"Print GCD followed by LCM.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"12 18\n","output":"6 36"},{"input":"7 13\n","output":"1 91"}],"tests":[{"input":"7 13\n","expected":"1 91"},{"input":"4 8\n","expected":"4 8"},{"input":"12 18\n","expected":"6 36"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){ int a,b; cin >> a >> b; int x=a,y=b; while(y!=0){ int temp=y; y=x%y; x=temp; } int gcd=x; int lcm=(a/gcd)*b; cout << gcd << \" \" << lcm; return 0; }","hints":["Find GCD with the Euclidean algorithm.","LCM times GCD equals a times b.","Divide before multiplying to reduce overflow risk."],"explanation":"The LCM can be calculated as (a/GCD)*b for positive inputs."},{"id":"L08","topic":"Logic Fundamentals","subtopic":"Nested loops · number pattern","difficulty":"Easy","title":"Print an increasing number pattern","statement":"For input N, print N rows. Row i contains the digit i repeated i times, for i from 1 to N.","inputFormat":"A positive integer N.","outputFormat":"The number pattern, one row per line.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n","output":"1\n22\n333\n4444"},{"input":"1\n","output":"1"}],"tests":[{"input":"1\n","expected":"1"},{"input":"3\n","expected":"1\n22\n333"},{"input":"4\n","expected":"1\n22\n333\n4444"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){ int n; cin >> n; for(int i=1;i<=n;i++){ for(int k=1;k<=i;k++) cout << i; if(i<n) cout << \"\\n\"; } return 0; }","hints":["The outer loop controls the row number.","The inner loop runs as many times as the row number.","Print i inside the inner loop."],"explanation":"Nested loops generate each row and repeat its row number."},{"id":"D001","topic":"Arrays","subtopic":"Debugging · Array maximum","difficulty":"Easy","title":"Fix the bug: Largest element in an array","statement":"The program should print the largest array element. Find and correct the logical error.\n\nBug category: Wrong comparison. Edit the supplied program and submit the corrected code.","inputFormat":"N followed by N integers.","outputFormat":"The largest element.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n-4 8 2 11 3\n","output":"11"},{"input":"3\n-9 -2 -7\n","output":"-2"}],"tests":[{"input":"3\n-9 -2 -7\n","expected":"-2"},{"input":"1\n42\n","expected":"42"},{"input":"5\n-4 8 2 11 3\n","expected":"11"}],"starterCode":"#include <iostream>\nusing namespace std;\nint main(){ int n,a[1000]; c r[i]; cin >> target;\n    int low=0, high=n-1, ans=-1;\n    while(low<=high){\n        int mid=low+(high-low)/2;\n        if(arr[mid]==target){ ans=mid; break; }\n        else if(arr[mid]<target) low=mid+1;\n        else high=mid-1;\n    }\n    cout << ans; return 0;\n}","hints":["Check what happens when arr[mid] is smaller than target.","Trace the code with a small input that exposes the bug.","Correct the faulty line, then run all test cases."],"explanation":"The intended algorithm is: The low/high interval shrinks by about half on every iteration.","mode":"debug","bugType":"Incorrect boundary update"},{"id":"D003","topic":"Arrays","subtopic":"Debugging · Bubble sort","difficulty":"Medium","title":"Fix the bug: Bubble sort ascending","statement":"The program should sort ascending using bubble sort. Correct the inner loop boundary.\n\nBug category: Off-by-one loop boundary. Edit the supplied program and submit the corrected code.","inputFormat":"N followed by N integers.","outputFormat":"Sorted array in ascending order.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n5 1 4 2 8\n","output":"1 2 4 5 8"},{"input":"1\n7\n","output":"7"}],"tests":[{"input":"1\n7\n","expected":"7"},{"input":"4\n4 -1 3 0\n","expected":"-1 0 3 4"},{"input":"5\n5 1 4 2 8\n","expected":"1 2 4 5 8"}],"starterCode":"#include <iostream>\nusing namespace std;\nint main(){ int n,a[1000]; cin>>n; for(int i=0;i<n;i++) cin>>a[i]; for(int i=0;i<n-1;i++) for(int k=0;k<n-i;k++) if(a[k]>a[k+1]){int temp=a[k];a[k]=a[k+1];a[k+1]=temp;} for(int i=0;i<n;i++) cout<<a[i]<<(i+1<n?\" \":\"\"); return 0; }","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000]; cin >> n; for(int i=0;i<n;i++) cin >> arr[i];\n    for(int i=0;i<n-1;i++) for(int k=0;k<n-1-i;k++)\n        if(arr[k]>arr[k+1]){ int temp=arr[k]; arr[k]=arr[k+1]; arr[k+1]=temp; }\n    for(int i=0;i<n;i++) cout << arr[i] << (i+1<n ? \" \" : \"\");\n    return 0;\   ['Sum of digits', 'sum += n % 10', 'Add the last digit and remove it using n/10.'],
  ['Product of digits', 'product *= n % 10', 'Start product at 1; process digits until n becomes 0.'],
  ['Digit count', 'count++; n = n/10', 'Each integer division removes one decimal digit.'],
  ['Palindrome number', 'reverse == original', 'Reverse the number without changing the saved original.'],
  ['Armstrong number', 'power *= digit; sum += power', 'Raise each digit to the total digit count using repeated multiplication, then add.'],
  ['GCD / LCM', 'gcd(a,b): (a,b)=(b,a%b)', 'LCM = (a / GCD) * b for positive inputs.'],
  ['Largest / smallest', 'if(arr[i] > largest)  /  if(arr[i] < smallest)', 'Initialize both values from arr[0], then update them in one traversal.'],
  ['Prime numbers in a range', 'for(int n=L; n<=R; n++)', 'Check each candidate from L through R and print it only when its divisor test says prime.'],
  ['Nested loops / patterns', 'for(int i=1;i<=n;i++)  for(int k=1;k<=i;k++)', 'The outer loop controls rows; the inner loop controls how many symbols appear in each row.'],
  ['Binary search', 'mid = low + (high-low)/2', 'Sorted array required; move low or high after comparison.'],
  ['Pointer address / value', 'int *p = &x;   cout << *p;', 'p stores x’s address; *p accesses the value at that address.'],
  ['Pointer vs reference', 'int *p = &x;   int &ref = x;', 'A pointer stores an address and can be reassigned. A reference is an alias and must be initialized.'],
  ['Pointer arithmetic', '*(p + i)', 'Moving a pointer by i advances i elements of its data type.'],
  ['Stack vs heap', 'int x;  // stack\nint *p = new int;  // heap', 'Local variables are generally automatic stack storage; dynamic allocation uses the heap.'],
  ['Dynamic allocation', 'int *p = new int[n];', 'Allocate storage according to input size, then release it.'],
  ['Array deallocation', 'delete[] p;', 'Use delete[] for memory allocated with new[].'],
  ['Memory leak', 'new[] without delete[]', 'Allocated memory that is never released remains unavailable to the program.'],
  ['Recursion base case', 'if(n == 0) return 0;', 'The base case stops the recursive calls. Each recursive step must move toward it.'],
  ['Recursion call stack', 'f(n) → f(n-1) → ...', 'Each call has its own parameters and local state until it returns.'],
  ['Call by reference', 'void change(int &x)', 'A reference parameter lets a function update the caller’s variable.']

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function localDateKey(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function formatDate(iso) {
  try { return new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch { return 'Recently'; }
}
