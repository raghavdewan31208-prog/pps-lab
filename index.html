function questionStatus(id) {
  if (state.progress.solvedIds.includes(id)) return 'solved';
  if (state.progress.attemptedIds.includes(id)) return 'revision';
  return 'new';
}
function statusLabel(id) {
  const status = questionStatus(id);
  return status === 'solved' ? 'Solved' : status === 'revision' ? 'Needs revision' : 'Not attempted';
}
function difficultyClass(value) { return String(value || 'Easy').toLowerCase(); }
function modeLabel(mode) {
  return ({ full: 'Full code', debug: 'Logic correction', fill: 'Fill missing code', predict: 'Predict output' })[mode] || 'Full code';
}
function modeClass(mode) { return ({ full: 'dot-blue', debug: 'dot-orange', fill: 'dot-purple', predict: 'dot-green' })[mode] || 'dot-blue'; }
function modeCount(mode) { return state.questions.filter(q => q.mode === mode).length; }
function getDateStreak() { return state.progress.streak || 0; }
function countAttempts() { return state.progress.totalSubmissions ?? state.progress.attempts.length; }
function accuracy() {
  const total = countAttempts();
  if (!total) return 0;
  const passed = state.progress.totalPassed ?? state.progress.attempts.filter(a => a.passed).length;
  return Math.round(passed / total * 100);
}
function formatDuration(ms) {
  const seconds = Math.max(0, Math.round((ms || 0) / 1000));
  return seconds < 60 ? `${seconds}s` : `${Math.floor(seconds/60)}m ${String(seconds%60).padStart(2,'0')}s`;
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); } catch (error) { console.warn('Could not save progress', error); }
}
function updateStreak() {
  const today = localDateKey();
  const last = state.progress.lastActivityDate;
  if (last === today) return;
  const yesterday = localDateKey(new Date(Date.now() - 86400000));
  state.progress.streak = last === yesterday ? (state.progress.streak || 0) + 1 : 1;
  state.progress.lastActivityDate = today;
}
function recordOutcome(question, passed, durationMs = 0, source = 'practice') {
  if (!question) return;
  updateStreak();
  if (!state.progress.attemptedIds.includes(question.id)) state.progress.attemptedIds.push(question.id);
  if (passed && !state.progress.solvedIds.includes(question.id)) state.progress.solvedIds.push(question.id);
  state.progress.totalSubmissions = countAttempts() + 1;
  if (passed) state.progress.totalPassed = (state.progress.totalPassed ?? state.progress.attempts.filter(a=>a.passed).length) + 1;
  const attempt = {
    id: question.id, title: question.title, topic: question.topic, mode: question.mode,
    passed: Boolean(passed), durationMs, source, at: new Date().toISOString()
  };
  state.progress.attempts.unshift(attempt);
  state.progress.attempts = state.progress.attempts.slice(0, 100);
  state.progress.lastQuestionId = question.id;
  state.progress.topicStats[question.topic] ||= { attempted: 0, passed: 0 };
  state.progress.topicStats[question.topic].attempted++;
  if (passed) state.progress.topicStats[question.topic].passed++;
  saveProgress();
}
function dailyChallengeQuestion() {
  const full = state.questions.filter(q => q.mode === 'full');
  if (!full.length) return null;
  const key = localDateKey();
  const hash = [...key].reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
  return full[hash % full.length];
}
function startQuestion(id) {
  const q = state.questions.find(item => item.id === id);

}

}
// Browser-only build: no local server, Node installation or GCC setup required.
// Compiler provider: bundled local Clang/WASI WebAssembly toolchain, using C++17.
const __privateBank = window.__PPS_PRIVATE_BANK;
const __publicBank = window.__PPS_PUBLIC_BANK;
const __examBank = Array.isArray(window.__PPS_EXAM_QUESTION_BANK) ? window.__PPS_EXAM_QUESTION_BANK : [];
const __existingIds = new Set(__privateBank.map(question => question.id));
const __newExamBank = __examBank.filter(question => !__existingIds.has(question.id));
__privateBank.push(...__newExamBank);
__publicBank.push(...__newExamBank.map(({tests,solution,explanation,...question}) => question));

async function api(url, payload, onProgress) {
  if (url === '/api/questions') return { questions: __publicBank };
  if (url === '/api/health') {
    const response = await fetch('wasm/clang', {method:'HEAD',cache:'no-store'});
    if (!response.ok) throw new Error('Local C++ toolchain assets returned HTTP ' + response.status + '. Check the GitHub Pages deployment.');
    return {ok:true,compiler:{available:true,version:'Local Clang/WASI · C++17'},questionCounts:{full:__publicBank.filter(q=>q.mode==='full').length,debugging:__publicBank.filter(q=>q.mode==='debug').length,fill:__publicBank.filter(q=>q.mode==='fill').length,predict:__publicBank.filter(q=>q.mode==='predict').length}};
  }
  if (url === '/api/run') {
    if (!payload?.code?.trim()) throw new Error('Enter a C++ program before running it.');
    const result=await __runLocalPps(payload.code,[{input:String(payload.stdin??''),visible:true}],onProgress);
    const row=result.testResults?.[0]||{};
    return {...result,stdout:row.actual||'',stderr:row.stderr||'',compileOutput:result.compileOutput||'',timeMs:result.executionTimeMs||0};
  }
  if (url === '/api/submit') {
    const q=__privateBank.find(item=>item.id===payload?.questionId);
    if(!q||q.mode==='predict')throw new Error('Question not found.');
    if(!payload?.code?.trim())throw new Error('Write your solution before submitting.');
    const tests=(q.tests||[]).map(test=>({input:String(test.input??''),expected:String(test.expected??''),visible:(q.samples||[]).some(sample=>sample.input===test.input)}));
    if(!tests.length)throw new Error('This question does not have an evaluation test suite yet.');
    return __runLocalPps(payload.code,tests,onProgress);
  }
  if (url.startsWith('/api/solution/')) {
    const id=decodeURIComponent(url.slice('/api/solution/'.length));
    const q=__privateBank.find(item=>item.id===id);
    if(!q)throw new Error('Solution not found.');
    return {solution:q.solution,explanation:q.explanation};
  }
  if (url === '/api/predict') {
    const q=__privateBank.find(item=>item.id===payload?.questionId);
    if(!q||q.mode!=='predict')throw new Error('Prediction question not found.');
    return {correct:__normalise(payload.answer)===__normalise(q.answer),expected:q.answer,explanation:q.explanation};
  }
  throw new Error('Unknown PPS Lab action: '+url);
}

function renderRevision() {
  const failedIds = [...new Set(state.progress.attempts.filter(a=>!a.passed).map(a=>a.id))].filter(id=>!state.progress.solvedIds.includes(id));
  const items = failedIds.map(id=>state.questions.find(q=>q.id===id)).filter(Boolean);
  return `<div class="page-heading"><div><div class="eyebrow">SPACED PRACTICE · PERSONAL WEAK LIST</div><h1 class="page-title">Revision mode</h1><div class="page-subtitle">Questions that have failed at least once and have not yet been solved. Fix the logic, not just the output.</div></div><div class="heading-actions"><button class="btn btn-primary" data-action="random-revision" ${items.length?'':'disabled'}>Start revision →</button></div></div>
    <div class="grid stats-grid"><div class="stat-card"><div class="stat-top">Questions to revisit</div><div class="stat-value">${items.length}</div><div class="stat-note">Unique unsolved questions with a failed submission</div></div><div class="stat-card"><div class="stat-top">Total attempts</div><div class="stat-value">${state.progress.attempts.length}</div><div class="stat-note">Across practice and mock exams</div></div><div class="stat-card"><div class="stat-top">Solved</div><div class="stat-value">${state.progress.solvedIds.length}</div><div class="stat-note">Questions passed at least once</div></div><div class="stat-card"><div class="stat-top">Accuracy</div><div class="stat-value">${accuracy()}<small>%</small></div><div class="stat-note">Passing submissions / all submissions</div></div></div>
    <div class="panel"><div class="panel-header"><div><h3 class="panel-title">Your revision queue</h3><div class="panel-kicker">Start a question to try it again with the same test cases.</div></div></div>${items.length?`<div class="bank-list">${items.map(questionRow).join('')}</div>`:`<div class="empty-state">Nothing in the revision queue yet. A failed submission will appear here. Once you pass that question, it leaves the queue.</div>`}</div>`;
}

function renderWorkspace() {
  const q = currentQuestion();
  if (!q) { state.selectedId = null; return renderPracticeHome(); }
  const hints = q.hints || [];
  const hintLevel = state.hintLevels[q.id] || 0;
  const showHint = hintLevel > 0;
  const samples = (q.samples || []).slice(0,2);
  const predict = q.mode === 'predict';
  return `<div class="page-heading" style="margin-bottom:13px"><div><div class="eyebrow">${modeLabel(q.mode).toUpperCase()} · ${esc(q.topic.toUpperCase())}</div><h1 class="page-title" style="font-size:20px">Practice workspace</h1></div><div class="heading-actions"><button class="btn btn-ghost btn-sm" data-page="bank">← Question bank</button>${state.progress.attemptedIds.includes(q.id)&&!state.solution?`<button class="btn btn-ghost btn-sm" data-action="reveal-solution">Reveal solution</button>`:``}<button class="btn btn-ghost btn-sm" data-action="next-question">Next question →</button></div></div>
    <div class="workspace-shell">
      <section class="workspace-left"><div class="workspace-scroll">
        <div class="workspace-topline"><span class="workspace-qid">QUESTION ${esc(q.id)}</span><span class="status-chip ${questionStatus(q.id)==='solved'?'solved':questionStatus(q.id)==='revision'?'revision':''}">${statusLabel(q.id)}</span></div>
        <h2 class="question-heading">${esc(q.title)}</h2>
        <div class="question-meta"><span class="difficulty ${difficultyClass(q.difficulty)}">${esc(q.difficulty)}</span><span class="topic-chip">${esc(q.topic)}</span><span class="mode-chip">${modeLabel(q.mode)}</span></div>
        <div class="section-label">PROBLEM STATEMENT</div><div class="question-description">${esc(q.statement)}</div>
        ${q.bugType?`<div class="callout" style="margin-top:11px"><strong>Bug category:</strong> ${esc(q.bugType)}</div>`:''}
        ${q.inputFormat?`<div class="question-section"><div class="section-label">INPUT FORMAT</div><div class="format-block">${esc(q.inputFormat)}</div></div>`:''}
        ${q.outputFormat?`<div class="question-section"><div class="section-label">OUTPUT FORMAT</div><div class="format-block">${esc(q.outputFormat)}</div></div>`:''}
        ${q.constraints?`<div class="question-section"><div class="section-label">CONSTRAINTS / NOTES</div><div class="question-description">${esc(q.constraints)}</div></div>`:''}
        ${samples.length?`<div class="question-section"><div class="section-label">SAMPLE TEST CASES</div>${samples.map((s,i)=>`<div class="sample-box"><div class="sample-label">SAMPLE ${i+1} · INPUT</div><pre>${esc(s.input)}</pre><div class="sample-label" style="margin-top:8px">EXPECTED OUTPUT</div><pre>${esc(s.output)}</pre></div>`).join('')}</div>`:''}
        <div class="question-section"><div class="section-label">HINTS · REVEAL ONE AT A TIME</div><div class="hint-actions">${hints.map((_,i)=>`<button class="hint-btn ${hintLevel>=i+1?'active':''}" data-action="show-hint" data-level="${i+1}">Hint ${i+1}</button>`).join('')}</div>${showHint?`<div class="hint-content">${hints.slice(0,hintLevel).map((h,i)=>`<div><strong>Hint ${i+1}:</strong> ${esc(h)}</div>`).join('<div class="divider"></div>')}</div>`:`<div class="small-note" style="margin-top:8px">Hints are optional. Try to reason through the logic first.</div>`}</div>
      </div></section>
      <section class="workspace-right">
        ${predict?renderPredictEditor(q):renderCodeEditor('practice-code','practice-highlight','practice-gutter',state.editorCode,'practice')}
        ${predict?'':renderConsole()}
      </section>
    </div>
    ${state.solution?`<div class="solution-panel"><h4>Reference solution · ${esc(q.id)}</h4><p>${esc(state.solution.explanation)}</p><pre>${esc(state.solution.solution)}</pre></div>`:''}`;
}

function renderCodeEditor(textareaId, highlightId, gutterId, code, context) {
  const toolbarActions = context === 'exam'
    ? `<span class="small-note">Answer saved as you type</span>`
    : `<button class="btn btn-ghost btn-icon" title="Copy code" data-action="copy-code">⧉</button><button class="btn btn-ghost" data-action="reset-code">↺ Reset</button><button class="btn btn-primary" data-action="run-code" ${state.busy?'disabled':''}>▶ Run</button><button class="btn btn-success" data-action="submit-code" ${state.busy?'disabled':''}>✓ Submit</button>`;
  return `<div class="editor-toolbar"><div class="editor-file"><span class="file-icon">▣</span><strong>main.cpp</strong><span class="muted">· C++17</span></div><div class="editor-toolbar-actions">${toolbarActions}</div></div>
    <div class="editor-area"><div class="line-gutter" id="${gutterId}">1</div><div class="code-stage"><pre class="code-highlight" id="${highlightId}" aria-hidden="true"></pre><textarea class="editor-textarea" id="${textareaId}" data-editor-context="${context}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="C++ code editor">${esc(code)}</textarea></div></div>
    <div class="editor-statusbar"><span>● C++17 · g++</span><span id="editor-cursor">Ln 1, Col 1</span><span>UTF-8</span></div>`;
}

function renderPredictEditor(q) {
  return `<div class="editor-toolbar"><div class="editor-file"><span class="file-icon">◉</span><strong>output-trace.cpp</strong><span class="muted">· Read only</span></div><span class="difficulty ${difficultyClass(q.difficulty)}">${esc(q.difficulty)}</span></div>
    <div class="workspace-scroll" style="background:#0b1220;flex:1"><pre class="predict-code">${esc(q.code)}</pre><div class="prediction-form"><div class="section-label">YOUR PREDICTED OUTPUT</div><textarea class="field" id="prediction-answer" rows="4" style="height:auto;min-height:90px;padding:10px 11px;font:10px/1.6 var(--mono);resize:vertical" placeholder="Type the exact output…"></textarea><button class="btn btn-primary" style="margin-top:10px" data-action="check-prediction">Check answer →</button><div id="prediction-feedback" style="margin-top:12px"></div></div></div>`;
}

function renderConsole() {
  const data = state.consoleData;
  return `<div class="console-wrap"><div class="console-tabs"><button class="console-tab ${state.consoleTab==='output'?'active':''}" data-action="console-tab" data-tab="output">Output</button><button class="console-tab ${state.consoleTab==='tests'?'active':''}" data-action="console-tab" data-tab="tests">Test cases</button><button class="console-tab ${state.consoleTab==='input'?'active':''}" data-action="console-tab" data-tab="input">Custom input</button><span style="margin-left:auto" class="small-note">64 KB output cap · 2s execution limit</span></div><div class="console-content">${state.consoleTab==='input'?`<div class="section-label">STANDARD INPUT (CIN)</div><textarea class="field" id="custom-input" rows="5" style="height:100%;min-height:105px;padding:10px;font:10px/1.5 var(--mono);resize:vertical" placeholder="Enter input exactly as you would in the terminal…">${esc(state.customInput)}</textarea>`:state.consoleTab==='tests'?renderTestOutput(data):renderRunOutput(data)}</div></div>`;
}
function renderRunOutput(data) {
  if (!data) return `<div class="console-empty">Run your code to see standard output and compiler diagnostics here.</div>`;
  if (data.status==='compile_error') return `<div class="console-status"><i class="status-dot offline"></i> Compilation failed</div><pre class="console-pre">${esc(data.compileOutput || data.error || 'Compilation failed.')}</pre>`;
  const label = data.status==='success' ? 'Execution successful' : data.status==='time_limit' ? 'Time limit exceeded' : data.status==='output_limit' ? 'Output limit exceeded' : 'Runtime error';
  return `<div class="console-status"><i class="status-dot ${data.status==='success'?'online':'offline'}"></i>${label} · ${data.timeMs||0} ms</div>${data.stdout?`<div class="section-label">STANDARD OUTPUT</div><pre class="console-pre">${esc(data.stdout)}</pre>`:`<div class="console-empty">Program produced no standard output.</div>`}${data.stderr?`<div class="section-label" style="margin-top:10px">STANDARD ERROR</div><pre class="console-pre">${esc(data.stderr)}</pre>`:''}`;
}
function renderTestOutput(data) {
  if (!data) return `<div class="console-empty">Submit your code to run every shown and hidden test case. Results will appear here one by one.</div>`;
  if (data.status === 'service_error') {
    return `<div class="console-status"><i class="status-dot offline"></i><strong>Local compiler unavailable</strong></div><pre class="console-pre">${esc(data.error || 'The compiler service did not return a result. Your answer was not graded.')}</pre>`;
  }

  const results = data.testResults || [];
  const total = Number(data.total ?? results.length);
  const passed = Number(data.passed ?? results.filter(item=>item.passed).length);
  const checked = results.filter(item=>item.status !== 'not_run').length;
  const failed = results.filter(item=>!item.passed && item.status !== 'not_run').length;
  const notRun = results.filter(item=>item.status === 'not_run').length;
  const isRunning = data.status === 'running';
  const isCompileError = data.status === 'compile_error';
  const accepted = Boolean(data.accepted);
  const headline = isRunning ? `Checking test cases… ${checked}/${total}`
    : accepted ? 'Accepted · All test cases passed'
    : isCompileError ? 'Compilation Error'
    : data.status === 'time_limit' ? 'Time Limit Exceeded'
    : data.status === 'runtime_error' ? 'Runtime Error'
    : 'Wrong Answer · Some test cases failed';
  const tone = accepted ? 'success' : (isRunning ? 'running' : 'failure');
  const pct = total ? Math.round((isRunning ? checked : passed) / total * 100) : 0;
  const statusLabel = result => {
    if (result.status === 'not_run') return 'NOT RUN';
    if (result.status === 'compile_error') return 'COMPILATION ERROR';
    if (result.status === 'time_limit') return 'TIME LIMIT';
    if (result.status === 'runtime_error') return 'RUNTIME ERROR';
    if (result.status === 'service_error') return 'SERVICE ERROR';
    return result.passed ? 'PASSED' : 'WRONG ANSWER';
  };
  const statusClass = result => result.passed ? 'test-pass' : 'test-fail';

  return `<div style="display:grid;gap:11px">
    <div class="test-result" style="padding:12px;border-color:${accepted?'#28634f':isRunning?'#385781':'#68404a'};background:${accepted?'#102a24':isRunning?'#14243a':'#2a1a22'}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:9px"><span class="status-dot ${accepted?'online':isRunning?'':'offline'}"></span><strong style="font-size:12px">${headline}</strong></div>
        <strong style="font:700 15px var(--mono);color:${accepted?'var(--green)':isRunning?'var(--blue)':'var(--red)'}">${passed}/${total}</strong>
      </div>
      <div style="height:7px;background:#202c40;border-radius:20px;overflow:hidden;margin-top:11px"><div style="height:100%;width:${pct}%;background:${accepted?'var(--green)':isRunning?'var(--blue)':'var(--red)'};border-radius:20px;transition:width .2s"></div></div>
      <div style="display:flex;gap:13px;flex-wrap:wrap;margin-top:9px;font-size:9px;color:#9aabc2">
        <span>✓ ${passed} passed</span><span>✕ ${failed} failed</span><span>◷ ${notRun} not run</span><span>${total} total</span>
        ${data.executionTimeMs?'<span>CPU '+Math.round(data.executionTimeMs)+' ms</span>':''}
      </div>
      ${isCompileError && data.compileOutput?`<div class="sample-label" style="margin-top:12px">COMPILER DIAGNOSTICS</div><pre class="console-pre" style="margin-top:5px">${esc(data.compileOutput)}</pre>`:''}
      ${isRunning?'<div class="small-note" style="margin-top:8px">Each test is executed with its own standard input. Please keep this tab open until evaluation finishes.</div>':''}
    </div>
    <div class="section-label" style="margin:2px 0 0">TEST CASE BREAKDOWN</div>
    <div class="test-result-list">${results.map((result,i)=>`<div class="test-result" style="padding:10px">
      <div class="test-result-top">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong>Test case ${result.index ?? i+1}</strong><span class="status-chip">${result.visible?'Shown · Sample':'Hidden test'}</span></div>
        <span class="${statusClass(result)}" style="font-weight:800">${result.passed?'✓ ':result.status==='not_run'?'○ ':'✕ '}${statusLabel(result)}</span>
      </div>
      ${result.visible?`<div class="section-label" style="margin-top:9px">INPUT</div><pre class="format-block">${esc(result.input ?? '')}</pre>
        <div class="sample-grid" style="margin-top:8px"><div><div class="sample-label">EXPECTED OUTPUT</div><pre>${esc(result.expected ?? '')}</pre></div><div><div class="sample-label">YOUR OUTPUT</div><pre>${esc(result.actual ?? '')}</pre></div></div>
        ${result.stderr?`<div class="sample-label" style="margin-top:8px">DIAGNOSTICS</div><pre class="console-pre">${esc(result.stderr)}</pre>`:''}
      `:`<div class="small-note" style="margin-top:7px">${result.status==='not_run'?'This case was not executed because the source did not compile.':'The hidden case was executed. Its input and expected output are deliberately not displayed; only its verdict is shown.'}</div>`}
    </div>`).join('') || '<div class="console-empty">Waiting for the first test case…</div>'}</div>
    <div class="small-note">${accepted?'Accepted. Your program passed every shown and hidden test case.':isRunning?'Evaluation is still in progress.':'Review the failed shown cases and adjust your logic before submitting again.'}</div>
  </div>`;
}

function renderExam() {
  if (state.examResult) return renderExamResult();
  if (!state.exam) return renderExamSetup();
  const exam = state.exam;
  const q = exam.items[exam.index];
  const clock = formatClock(exam.remaining);
  const answer = exam.answers[q.id] ?? (q.mode==='predict' ? '' : q.starterCode || '');
  return `<div class="page-heading"><div><div class="eyebrow">TIMED PPS PRACTICAL SIMULATION</div><h1 class="page-title">Mock examination</h1><div class="page-subtitle">${exam.items.length} randomized tasks · ${exam.duration} minutes · No solutions are shown during the test.</div></div><div class="exam-clock ${exam.remaining<300?'urgent':''}" id="exam-clock">${clock}</div></div>
    <div class="exam-active-top"><div class="tag-line"><span class="status-chip">Question ${exam.index+1} of ${exam.items.length}</span><span class="topic-chip">${esc(q.topic)}</span><span class="mode-chip">${modeLabel(q.mode)}</span></div><div class="heading-actions"><button class="btn btn-ghost btn-sm" data-action="exam-mark">${exam.marked.includes(q.id)?'★ Marked for review':'☆ Mark for review'}</button><button class="btn btn-danger btn-sm" data-action="exam-finish">Submit examination</button></div></div>
    <div class="exam-layout"><div class="panel" style="min-width:0"><div class="panel-header"><div><h3 class="panel-title">${esc(q.title)}</h3><div class="panel-kicker">${esc(q.id)} · ${esc(q.difficulty)} · ${modeLabel(q.mode)}</div></div><span class="status-chip">${q.mode==='predict'?'Trace output':'C++17 coding'}</span></div><div class="question-description" style="margin-bottom:13px">${esc(q.statement)}</div>${q.mode==='predict'?`<pre class="predict-code">${esc(q.code)}</pre><div style="margin-top:12px"><label class="filter-label">YOUR PREDICTED OUTPUT</label><textarea class="field" id="exam-prediction" rows="3" style="height:auto;min-height:80px;padding:10px;font:10px/1.6 var(--mono)">${esc(answer)}</textarea></div>`:`${q.samples?.[0]?`<div class="sample-box" style="margin-bottom:12px"><div class="sample-label">SAMPLE INPUT</div><pre>${esc(q.samples[0].input)}</pre><div class="sample-label" style="margin-top:7px">EXPECTED OUTPUT</div><pre>${esc(q.samples[0].output)}</pre></div>`:''}${renderCodeEditor('exam-code','exam-highlight','exam-gutter',answer,'exam')}`}</div>
      <aside class="panel"><div class="panel-header"><div><h3 class="panel-title">Question palette</h3><div class="panel-kicker">Navigate without losing your code</div></div></div><div class="exam-questions-nav">${exam.items.map((item,i)=>`<button class="exam-nav-btn ${i===exam.index?'active':''} ${exam.marked.includes(item.id)?'review':''} ${exam.touched[item.id]?'done':''}" data-action="exam-go" data-index="${i}" title="${esc(item.id)}">${i+1}</button>`).join('')}</div><div class="divider"></div><div class="exam-side-note"><div style="margin-bottom:6px"><span class="status-chip">Blue</span> Current question</div><div style="margin-bottom:6px"><span class="status-chip solved">Green</span> Answer entered</div><div><span class="status-chip" style="color:#c6b3ff">Purple</span> Marked for review</div></div><div class="divider"></div><div class="small-note">Your code and predictions stay in this tab while the test is active. The exam submits automatically when the timer reaches zero.</div><div style="margin-top:15px"><button class="btn btn-primary btn-wide" data-action="exam-next">${exam.index===exam.items.length-1?'Review first question':'Next question →'}</button></div></aside>
    </div>`;
}
function renderExamSetup() {
  return `<div class="page-heading"><div><div class="eyebrow">SIMULATE THE PRACTICAL EXAM</div><h1 class="page-title">Mock examination</h1><div class="page-subtitle">A timed set drawn from full-program, debugging, fill-in-code and output-prediction exercises.</div></div></div>
    <div class="exam-config panel"><div class="eyebrow">TEST CONFIGURATION</div><h2 style="font-size:20px;margin:0 0 7px">Set your exam duration</h2><div class="page-subtitle">The test contains six randomized questions. All code answers are compiled and checked by the online G++ service.</div><div class="exam-config-grid">${[30,60,90].map(n=>`<button class="exam-config-option ${state.examDuration===n?'active':''}" data-action="exam-duration" data-duration="${n}"><strong>${n}</strong><span>minutes</span></button>`).join('')}</div><div class="callout">You will receive a mix of problem types. Mark questions for review, navigate freely, and submit when finished. The score report shows topic-wise performance.</div><div class="divider"></div><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px"><div><div class="section-label">QUESTIONS</div><strong style="font-size:18px">6</strong></div><div><div class="section-label">CODE COMPILER</div><strong style="font-size:12px">C++17 / G++</strong></div><div><div class="section-label">AUTO SUBMIT</div><strong style="font-size:12px">On timer end</strong></div></div><button class="btn btn-primary" data-action="exam-start">Start examination →</button></div>`;

function renderExamResult() {
  const result = state.examResult;
  const total = result.items.length;
  const score = result.items.filter(item=>item.passed).length;
  const topics = [...new Set(result.items.map(item=>item.topic))].map(topic=>({topic,items:result.items.filter(i=>i.topic===topic)}));
  return `<div class="page-heading"><div><div class="eyebrow">EXAMINATION COMPLETE</div><h1 class="page-title">Your mock test report</h1><div class="page-subtitle">${result.auto?'The timer expired and the test was submitted automatically.':'Your answers were submitted and evaluated.'}</div></div><div class="heading-actions"><button class="btn btn-primary" data-action="exam-restart">Take another test →</button></div></div>
    <div class="grid dashboard-grid"><div class="panel"><div class="eyebrow">FINAL SCORE</div><div class="result-score">${score}<span> / ${total} passed</span></div><div class="page-subtitle">${Math.round(score/total*100)}% question accuracy · ${result.duration} minute exam</div><div class="divider"></div><div class="section-heading" style="margin-top:0">Topic-wise performance</div>${topics.map(t=>`<div class="topic-result-row"><span>${esc(t.topic)}</span><div class="progress-track"><div class="progress-fill" style="width:${Math.round(t.items.filter(i=>i.passed).length/t.items.length*100)}%"></div></div><span>${t.items.filter(i=>i.passed).length}/${t.items.length}</span></div>`).join('')}</div><div class="panel"><h3 class="panel-title">Exam summary</h3><div class="activity-list" style="margin-top:12px">${result.items.map((item,i)=>`<div class="activity-row"><div class="activity-mark ${item.passed?'':'failed'}">${item.passed?'✓':'!'}</div><div class="activity-info"><strong>${esc(item.title)}</strong><span>${esc(item.id)} · ${esc(item.topic)}</span></div><div class="activity-result ${item.passed?'':'failed'}">${item.passed?'PASS':'REVIEW'}</div></div>`).join('')}</div></div></div>
    <div class="panel" style="margin-top:14px"><div class="panel-header"><div><h3 class="panel-title">Review incorrect questions</h3><div class="panel-kicker">Open a question to solve it again outside the timed test.</div></div></div><div class="bank-list">${result.items.filter(i=>!i.passed).map(i=>questionRow(i.question)).join('') || '<div class="empty-state">Every question passed. That is the correct kind of surprise.</div>'}</div></div>`;
}
function formatClock(seconds) {
  const mins = Math.floor(Math.max(0,seconds)/60);
  const secs = Math.max(0,seconds)%60;
  return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

function highlightCode(source) {
  const escaped = esc(source || ' ');
  const token = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|#include\s*<[^>]+>|\b(?:int|double|float|char|void|bool|long|short|unsigned|const|auto|string|return|if|else|for|while|do|switch|case|break|continue|using|namespace|new|delete|struct|true|false|nullptr)\b|\b\d+(?:\.\d+)?\b|\b(?:cin|cout|endl|std)\b)/g;
  return escaped.replace(token, match => {
    let cls = 'tok-key';
    if (match.startsWith('//') || match.startsWith('/*')) cls='tok-comment';
    else if (match.startsWith('"') || match.startsWith("'")) cls='tok-string';
    else if (match.startsWith('#')) cls='tok-pre';
    else if (/^\d/.test(match)) cls='tok-number';
    else if (/^(int|double|float|char|void|bool|long|short|unsigned|string)$/.test(match)) cls='tok-type';
    else if (/^(cin|cout|endl|std)$/.test(match)) cls='tok-fn';
    return `<span class="${cls}">${match}</span>`;
  });
}
function setEditorDisplay(textarea, highlight, gutter) {
  const code = textarea.value;
  highlight.innerHTML = highlightCode(code);
  const lines = Math.max(1, code.split('\n').length);
  gutter.textContent = Array.from({length:lines},(_,i)=>i+1).join('\n');
  highlight.scrollTop = textarea.scrollTop;
  highlight.scrollLeft = textarea.scrollLeft;
  gutter.scrollTop = textarea.scrollTop;
}
function setupEditor(textareaId, highlightId, gutterId) {
  const textarea = document.getElementById(textareaId);
  const highlight = document.getElementById(highlightId);
  const gutter = document.getElementById(gutterId);
  if (!textarea || !highlight || !gutter || textarea.dataset.bound) return;
  textarea.dataset.bound = '1';
  const update = (markTouched = false) => {
    setEditorDisplay(textarea,highlight,gutter);
    const pos = textarea.selectionStart;
    const before = textarea.value.slice(0,pos).split('\n');
    const cursor = document.getElementById('editor-cursor');
    if (cursor) cursor.textContent = `Ln ${before.length}, Col ${before[before.length-1].length+1}`;
    if (textarea.dataset.editorContext === 'practice') {
      state.editorCode = textarea.value;
      const q = currentQuestion();
      if (q) { state.progress.drafts[q.id] = textarea.value; saveProgress(); }
    } else if (textarea.dataset.editorContext === 'exam' && state.exam) {
      const q = state.exam.items[state.exam.index];
      state.exam.answers[q.id] = textarea.value;
      if(markTouched) state.exam.touched[q.id] = true;
    }
  };
  textarea.addEventListener('input',()=>update(true));
  textarea.addEventListener('scroll',()=>{highlight.scrollTop=textarea.scrollTop;highlight.scrollLeft=textarea.scrollLeft;gutter.scrollTop=textarea.scrollTop;});
  textarea.addEventListener('click',update);
  textarea.addEventListener('keyup',update);
  textarea.addEventListener('keydown',event=>{
    const pairs={'(':')','[':']','{':'}','"':'"',"'":"'"};
    const start=textarea.selectionStart;
    const end=textarea.selectionEnd;
    const value=textarea.value;
    const selected=start!==end;
    const closing=Object.values(pairs);
    if(event.key==='Tab'){
      event.preventDefault();
      textarea.setRangeText('    ',start,end,'end');
      textarea.dispatchEvent(new Event('input',{bubbles:true}));
      return;
    }
    if(event.key==='Backspace' && start===end && start>0 && pairs[value[start-1]]===value[start]){
      event.preventDefault();
      textarea.setRangeText('',start-1,start+1,'end');
      textarea.dispatchEvent(new Event('input',{bubbles:true}));
      return;
    }
    if(closing.includes(event.key) && start===end && value[start]===event.key){
      event.preventDefault();
      textarea.setSelectionRange(start+1,start+1);
      update();
      return;
    }
    if(event.key==='Enter'){
      event.preventDefault();
      const before=value.slice(0,start);
      const line=before.split('\n').pop();
      const indent=(line.match(/^\s*/)||[''])[0];
      const after=value.slice(end);
      const hasClosingBrace=line.trimEnd().endsWith('{') && after.startsWith('}');
      if(hasClosingBrace){
        const insertion='\n'+indent+'    '+'\n'+indent;
        textarea.setRangeText(insertion,start,end,'end');
        textarea.setSelectionRange(start+1+indent.length+4,start+1+indent.length+4);
      }else if(line.trimEnd().endsWith('{')){
        const insertion='\n'+indent+'    '+'\n'+indent+'}';
        textarea.setRangeText(insertion,start,end,'end');
        textarea.setSelectionRange(start+1+indent.length+4,start+1+indent.length+4);
      }else{
        const insertion='\n'+indent;
        textarea.setRangeText(insertion,start,end,'end');
        textarea.setSelectionRange(start+insertion.length,start+insertion.length);
      }
      textarea.dispatchEvent(new Event('input',{bubbles:true}));
      return;
    }
    if(Object.prototype.hasOwnProperty.call(pairs,event.key)){
      const next=value[start]||'';
      const previous=value[start-1]||'';
      if(event.key==='"' || event.key==="'"){
        if(next===event.key){event.preventDefault();textarea.setSelectionRange(start+1,start+1);update();return;}
        if(previous && /[\w]/.test(previous) && !selected)return;
      }
      event.preventDefault();
      const selectedText=selected?value.slice(start,end):'';
      const insertion=event.key+selectedText+pairs[event.key];
      textarea.setRangeText(insertion,start,end,'end');
      const cursor=start+1+selectedText.length;
      textarea.setSelectionRange(cursor,cursor);
      textarea.dispatchEvent(new Event('input',{bubbles:true}));
    }
  });
  update();
}

/* Local WebAssembly compiler: no Judge0, no API key, no CORS dependency. */
const __compiledModuleCache = new Map();
function __compileWithLocalClang(source, onProgress) {
  const cacheKey=String(source || '');
  if(__compiledModuleCache.has(cacheKey)) return Promise.resolve(__compiledModuleCache.get(cacheKey));
  return new Promise((resolve,reject)=>{
    const worker=new Worker('compiler/compiler-worker.js');
    let settled=false;
    const finish=(fn,value)=>{if(settled)return;settled=true;clearTimeout(timer);worker.terminate();fn(value);};
    const timer=setTimeout(()=>finish(reject,new Error('The local C++ compiler took too long to initialize. Refresh the page and retry.')),180000);
    worker.onmessage=event=>{
      const {id,data}=event.data||{};
      if(id==='phase'||id==='progress'){if(onProgress)onProgress(data);return;}
      if(id==='compiled'){
        __compiledModuleCache.set(cacheKey,data.module);
        while(__compiledModuleCache.size>4) __compiledModuleCache.delete(__compiledModuleCache.keys().next().value);
        finish(resolve,data.module);
      }
      else if(id==='failed')finish(resolve,{__compileFailure:true,...data});
      else if(id==='fatal')finish(reject,new Error(data?.message||'The local compiler could not start.'));
    };
    worker.onerror=event=>finish(reject,new Error(event.message||'The local compiler worker failed to load.'));
    worker.postMessage({id:'compile',data:{source}});
  });
}
function __runWithLocalClang(module, tests, onCase, timeoutMs=20000) {
  return new Promise((resolve,reject)=>{
    const worker=new Worker('compiler/run-worker.js');
    let settled=false;
    let completed=0;
    const results=[];
    const started=performance.now();
    const finish=(fn,value)=>{if(settled)return;settled=true;clearTimeout(timer);worker.terminate();fn(value);};
    const timer=setTimeout(()=>{
      const remaining=tests.length-completed;
      for(let i=0;i<remaining;i++)results.push({index:completed+i+1,passed:false,visible:!!tests[completed+i]?.visible,status:'time_limit'});
      finish(resolve,{status:'time_limit',passed:results.filter(x=>x.passed).length,total:tests.length,accepted:false,executionTimeMs:Math.round(performance.now()-started),testResults:results});
    },timeoutMs);
    worker.onmessage=event=>{
      const {id,data}=event.data||{};
      if(id==='case'){
        const test=tests[data.index];
        const passed=data.status==='success' && (test.expected===undefined || __normalise(data.stdout)===__normalise(test.expected));
        const row={index:data.index+1,passed,visible:!!test.visible,status:data.status==='success'?(passed?'passed':'wrong_answer'):data.status};
        if(test.visible){row.input=test.input;row.expected=test.expected;row.actual=data.stdout||'';row.stderr=data.stderr||'';}
        results[data.index]=row;
        completed++;
        if(onCase)onCase({status:'running',passed:results.filter(x=>x?.passed).length,total:tests.length,accepted:false,executionTimeMs:Math.round(performance.now()-started),testResults:results.filter(Boolean)});
      } else if(id==='suite-done'){
        const finalResults=results.filter(Boolean);
        const passed=finalResults.filter(x=>x.passed).length;
        finish(resolve,{status:passed===tests.length?'accepted':(finalResults.find(x=>x.status==='runtime_error')?'runtime_error':'wrong_answer'),passed,total:tests.length,accepted:passed===tests.length&&finalResults.length===tests.length,executionTimeMs:Math.round(performance.now()-started),testResults:finalResults});
      } else if(id==='fatal'){
        finish(reject,new Error(data?.message||'The local execution engine failed.'));
      }
    };
    worker.onerror=event=>finish(reject,new Error(event.message||'The local execution worker failed.'));
    worker.postMessage({id:'run-suite',data:{module,tests:tests.map(t=>({input:t.input||''}))}});
  });
}
async function __runLocalPps(code, tests, onProgress) {
  const module=await __compileWithLocalClang(code,onProgress);
  if(module?.__compileFailure)return {status:'compile_error',compiled:false,compileOutput:module.message||'Compilation failed.',passed:0,total:tests.length,accepted:false,testResults:tests.map((t,i)=>({index:i+1,passed:false,visible:!!t.visible,status:'not_run'}))};
  return __runWithLocalClang(module,tests,onProgress);
}

async function runCurrentCode(submit) {
  const q=currentQuestion();
  if(!q || state.busy) return;
  const code=$('#practice-code')?.value ?? state.editorCode;
  state.editorCode=code;
  state.customInput=$('#custom-input')?.value ?? state.customInput;
  state.consoleTab=submit?'tests':'output';
  state.busy=true;
  const content=$('.console-content');
  if(content)content.innerHTML='<div class="console-status"><i class="status-dot"></i> Starting local C++17 compiler…</div><div class="console-empty">First use downloads and caches the compiler in your browser. No external compiler API is involved.</div>';
  $$('[data-action="run-code"],[data-action="submit-code"]').forEach(b=>b.disabled=true);
  $$('.console-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.consoleTab));
  try {
    let tests;
    if(submit){
      const bankQuestion=__privateBank.find(item=>item.id===q.id);
      if(!bankQuestion)throw new Error('Question test suite not found.');
      tests=(bankQuestion.tests||[]).map(test=>({input:test.input||'',expected:test.expected||'',visible:(q.samples||[]).some(sample=>sample.input===test.input)}));
      if(!tests.length)throw new Error('This question does not have test cases yet.');
    }else{
      tests=[{input:state.customInput||'',visible:true}];
    }
    const data=await __runLocalPps(code,tests,progress=>{
      if(progress?.phase){
        const target=$('.console-content');
        if(target)target.innerHTML='<div class="console-status"><i class="status-dot"></i>'+esc(progress.message||'Preparing compiler…')+'</div>';
      }else if(submit){
        state.consoleData=progress;
        const target=$('.console-content');
        if(target)target.innerHTML=renderTestOutput(progress);
      }
    });
    if(!submit){
      const result=data.testResults?.[0];
      state.consoleData={
        status:data.status==='accepted'?'success':data.status==='compile_error'?'compile_error':data.status,
        stdout:result?.actual||'',stderr:result?.stderr||'',
        compileOutput:data.compileOutput||'',timeMs:data.executionTimeMs||0
      };
    }else{
      state.consoleData=data;
      recordOutcome(q,Boolean(data.accepted),Date.now()-state.questionStartedAt,'practice');
      if(data.accepted){toast('Accepted. All shown and hidden test cases passed.','success');if(q.id===dailyChallengeQuestion()?.id){const key=localDateKey();if(!state.progress.dailyCompleted.includes(key))state.progress.dailyCompleted.push(key);saveProgress();}}
      else toast(data.status==='compile_error'?'Compilation failed. Check the diagnostics.':data.status==='time_limit'?'Time limit exceeded.':'Some test cases failed. Inspect the results panel.','error');
    }
  }catch(error){
    state.consoleData={status:'service_error',error:error.message,stdout:'',stderr:''};
    toast(error.message,'error');
  }finally{
    state.busy=false;
    if(submit)render();
    else{
      const target=$('.console-content');
      if(target)target.innerHTML=state.consoleTab==='tests'?renderTestOutput(state.consoleData):renderRunOutput(state.consoleData);
      $$('[data-action="run-code"],[data-action="submit-code"]').forEach(b=>b.disabled=false);
      $$('.console-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.consoleTab));
      updateChrome();
    }
  }
}

function randomFrom(list) { return list[Math.floor(Math.random()*list.length)]; }
function startRandomPractice(revision=false) {
  let list=state.questions.filter(q=>q.mode==='full');
  if(revision){const ids=[...new Set(state.progress.attempts.filter(a=>!a.passed).map(a=>a.id))];list=ids.map(id=>state.questions.find(q=>q.id===id)).filter(Boolean);}
  if(!list.length){toast('No questions are available in this queue.');return;}
  startQuestion(randomFrom(list).id);
}
function nextQuestion() {
  const current=currentQuestion();
  const list=state.questions.filter(q=>q.mode===state.practiceMode);
  const index=list.findIndex(q=>q.id===current?.id);
  startQuestion(list[(index+1)%list.length].id);
}

function startExam() {
  const full=randomFrom([...state.questions.filter(q=>q.mode==='full')]);
  const debug=randomFrom([...state.questions.filter(q=>q.mode==='debug')]);
  const fill=randomFrom([...state.questions.filter(q=>q.mode==='fill')]);
  const predict=randomFrom([...state.questions.filter(q=>q.mode==='predict')]);
  const otherFull=randomFrom(state.questions.filter(q=>q.mode==='full' && q.id!==full.id && q.topic!==full.topic));
  const otherTask=randomFrom(state.questions.filter(q=>['full','debug','fill'].includes(q.mode) && q.id!==debug.id && q.id!==fill.id && q.id!==full.id && q.id!==otherFull.id));
  const items=[full,otherFull,debug,fill,otherTask,predict].sort(()=>Math.random()-.5);
  state.exam={items,duration:state.examDuration,remaining:state.examDuration*60,index:0,answers:{},marked:[],startedAt:Date.now(),timings:{},touched:{},questionStartedAt:Date.now()};
  state.examResult=null;
  items.forEach(q=>{if(q.mode!=='predict')state.exam.answers[q.id]=q.starterCode||'';else state.exam.answers[q.id]='';});
  state.page='exam';
  render();
  clearInterval(state.timerId);
  state.timerId=setInterval(()=>{
    if(!state.exam)return;
    state.exam.remaining--;
    const clock=$('#exam-clock');
    if(clock){clock.textContent=formatClock(state.exam.remaining);clock.classList.toggle('urgent',state.exam.remaining<300);}
    if(state.exam.remaining<=0) finishExam(true);
  },1000);
}
async function finishExam(auto=false) {
  if(!state.exam || state.examSubmitting)return;
  if(!auto && !window.confirm('Submit the examination now? Your unanswered questions will be evaluated as they are.')) return;
  saveExamCurrentAnswer();
  state.examSubmitting=true;
  clearInterval(state.timerId);
  toast(auto?'Time is up. Submitting the examination.':'Submitting and evaluating your answers…');
  const exam=state.exam;
  const results=[];
  for(const q of exam.items){
    try {
      let passed=false;
      if(q.mode==='predict'){
        const res=await api('/api/predict',{questionId:q.id,answer:exam.answers[q.id]||''});
        passed=res.correct;
      } else {
        const res=await api('/api/submit',{questionId:q.id,code:exam.answers[q.id]??q.starterCode??''});
        passed=Boolean(res.accepted);
      }
      recordOutcome(q,passed,exam.timings[q.id]||0,'mock exam');
      results.push({id:q.id,title:q.title,topic:q.topic,passed,question:q});
    } catch(error) {
      recordOutcome(q,false,exam.timings[q.id]||0,'mock exam');
      results.push({id:q.id,title:q.title,topic:q.topic,passed:false,question:q,error:error.message});
    }
  }
  state.progress.examHistory.unshift({at:new Date().toISOString(),duration:exam.duration,score:results.filter(r=>r.passed).length,total:results.length});
  state.progress.examHistory=state.progress.examHistory.slice(0,30);
  saveProgress();
  state.examResult={items:results,duration:exam.duration,auto};
  state.exam=null;
  state.examSubmitting=false;
  render();
}

  if(name==='reveal-solution'){revealSolution();return;}

  if(name==='show-all-logic'){const panel=$('#page-content');if(panel){const all=QUICK_REVISION.map(([t,f,d])=>logicCard(t,f,d)).join('');const block=document.createElement('div');block.className='panel';block.style.marginTop='14px';block.innerHTML=`<div class="panel-header"><h3 class="panel-title">All logic fundamentals</h3><span class="status-chip">Quick revision</span></div><div class="quick-revision">${all}</div>`;panel.append(block);action.textContent='All logic fundamentals shown';action.disabled=true;}return;}
  if(name==='next-question'){nextQuestion();return;}
  if(name==='exam-duration'){state.examDuration=Number(action.dataset.duration);render();return;}
  if(name==='exam-start'){if(!state.health?.compiler?.available){toast('The online compiler is unavailable. Check your internet connection and refresh.','error');return;}startExam();return;}
  if(name==='exam-go'){if(state.exam){saveExamCurrentAnswer();state.exam.index=Number(action.dataset.index);render();}return;}
  if(name==='exam-mark'){if(state.exam){saveExamCurrentAnswer();const id=state.exam.items[state.exam.index].id;state.exam.marked=state.exam.marked.includes(id)?state.exam.marked.filter(x=>x!==id):[...state.exam.marked,id];render();}return;}
  if(name==='exam-next'){if(state.exam){saveExamCurrentAnswer();state.exam.index=(state.exam.index+1)%state.exam.items.length;render();}return;}
  if(name==='exam-finish'){finishExam(false);return;}
  if(name==='exam-restart'){state.examResult=null;state.exam=null;render();return;}
});
function saveExamCurrentAnswer(){
  if(!state.exam)return;
  const q=state.exam.items[state.exam.index];
  if(q.mode==='predict') state.exam.answers[q.id]=$('#exam-prediction')?.value??state.exam.answers[q.id]??'';
  else state.exam.answers[q.id]=$('#exam-code')?.value??state.exam.answers[q.id]??'';
  const now=Date.now();
  state.exam.timings[q.id]=(state.exam.timings[q.id]||0)+Math.max(0,now-(state.exam.questionStartedAt||now));
  state.exam.questionStartedAt=now;
}

document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){$('#sidebar')?.classList.remove('open');}
});
$('#mobile-menu')?.addEventListener('click',()=>$('#sidebar').classList.toggle('open'));

async function boot() {
  try {
    // Load the local question bank independently so a compiler outage never blocks practice pages.
    const questionData = await api('/api/questions');
    state.questions = questionData.questions || [];
    if (!state.questions.length) throw new Error('The question bank is empty.');
    try {
      state.health = await api('/api/health');
    } catch (compilerError) {
      state.health = { ok:false, compiler:{ available:false, version:'Compiler connection unavailable' } };
      state.compilerError = compilerError?.message || 'Online compiler unavailable.';
    }
    render();
    if (!state.health.compiler?.available) toast('Question bank loaded. The online compiler could not be reached: ' + (state.compilerError || 'check your internet connection.'), 'error');
  } catch(error) {
    $('#page-content').innerHTML=`<div class="panel"><h2>Could not load the practice lab</h2><p class="page-subtitle">${esc(error.message)}</p><p class="small-note">Close and reopen this HTML file in Chrome or Edge.</p></div>`;
  }
}
boot();

</script>
</body>
