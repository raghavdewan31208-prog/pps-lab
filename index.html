  <script>window.__PPS_PRIVATE_BANK=[{"id":"A01","topic":"Arrays","subtopic":"1D arrays · traversal","difficulty":"Easy","title":"Sum of array elements","statement":"Read N integers into an array and print their sum.","inputFormat":"First line: N. Second line: N integers.","outputFormat":"A single integer: the sum.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n2 4 1 3 5\n","output":"15"},{"input":"1\n9\n","output":"9"}],"tests":[{"input":"1\n9\n","expected":"9"},{"input":"4\n-2 5 -1 3\n","expected":"5"},{"input":"5\n2 4 1 3 5\n","expected":"15"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, sum = 0;\n    cin >> n;\n    int arr[1000];\n    for(int i=0;i<n;i++){ cin >> arr[i]; sum += arr[i]; }\n    cout << sum;\n    return 0;\n}","hints":["Use one loop to read the elements.","Update a running total during input.","Start sum at 0, then add each arr[i]."],"explanation":"Each element is added exactly once to a running sum."},{"id":"A02","topic":"Arrays","subtopic":"1D arrays · average","difficulty":"Easy","title":"Average of array elements","statement":"Read N integers and print their arithmetic mean. Print the result using default C++ floating-point formatting.","inputFormat":"N followed by N integers.","outputFormat":"The average as a number.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n2 4 6 8\n","output":"5"},{"input":"1\n7\n","output":"7"}],"tests":[{"input":"1\n7\n","expected":"7"},{"input":"3\n1 2 2\n","expected":"1.66667"},{"input":"4\n2 4 6 8\n","expected":"5"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, sum=0; cin >> n;\n    int arr[1000];\n    for(int i=0;i<n;i++){ cin >> arr[i]; sum += arr[i]; }\n    double avg = (double)sum / n;\n    cout << avg;\n    return 0;\n}","hints":["The average is sum divided by count.","Make the division floating-point, not integer division.","Convert sum to double before dividing by n."],"explanation":"Casting the numerator to double preserves the fractional part."},{"id":"A03","topic":"Arrays","subtopic":"1D arrays · maximum","difficulty":"Easy","title":"Largest element in an array","statement":"Find and print the largest value in an array of N integers. Values may all be negative.","inputFormat":"N followed by N integers.","outputFormat":"The largest element.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n-4 8 2 11 3\n","output":"11"},{"input":"3\n-9 -2 -7\n","output":"-2"}],"tests":[{"input":"3\n-9 -2 -7\n","expected":"-2"},{"input":"1\n42\n","expected":"42"},{"input":"5\n-4 8 2 11 3\n","expected":"11"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n; cin >> n;\n    int arr[1000];\n    for(int i=0;i<n;i++) cin >> arr[i];\n    int largest = arr[0];\n    for(int i=1;i<n;i++) if(arr[i] > largest) largest = arr[i];\n    cout << largest;\n    return 0;\n}","hints":["Do not assume the largest value is positive.","Use the first array element as the initial maximum.","Compare every remaining element with largest."],"explanation":"Initializing from arr[0] works even when every input is negative."},{"id":"A04","topic":"Arrays","subtopic":"1D arrays · minimum","difficulty":"Easy","title":"Smallest element in an array","statement":"Read N integers and print the smallest element.","inputFormat":"N followed by N integers.","outputFormat":"The smallest element.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n8 -4 2 11 3\n","output":"-4"},{"input":"3\n9 4 7\n","output":"4"}],"tests":[{"input":"3\n9 4 7\n","expected":"4"},{"input":"1\n-5\n","expected":"-5"},{"input":"5\n8 -4 2 11 3\n","expected":"-4"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n; cin >> n; int arr[1000];\n    for(int i=0;i<n;i++) cin >> arr[i];\n    int smallest=arr[0];\n    for(int i=1;i<n;i++) if(arr[i]<smallest) smallest=arr[i];\n    cout << smallest; return 0;\n}","hints":["The first value is a safe starting candidate.","Look for values smaller than the current candidate.","Update smallest whenever arr[i] < smallest."],"explanation":"A single pass finds the minimum in O(N) time."},{"id":"A05","topic":"Arrays","subtopic":"1D arrays · reversal","difficulty":"Easy","title":"Reverse an array","statement":"Print the elements of the given array in reverse order. Do not reverse the input while reading it.","inputFormat":"N followed by N integers.","outputFormat":"N integers in reverse order, separated by spaces.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n1 2 3 4 5\n","output":"5 4 3 2 1"},{"input":"1\n8\n","output":"8"}],"tests":[{"input":"1\n8\n","expected":"8"},{"input":"4\n2 9 -1 7\n","expected":"7 -1 9 2"},{"input":"5\n1 2 3 4 5\n","expected":"5 4 3 2 1"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000]; cin >> n;\n    for(int i=0;i<n;i++) cin >> arr[i];\n    for(int i=n-1;i>=0;i--) cout << arr[i] << (i ? \" \" : \"\");\n    return 0;\n}","hints":["The last valid index is n-1.","Print from the last index down to zero.","Use a loop initialized at n-1 and decrement i."],"explanation":"Reverse-order traversal prints the array without changing its stored order."},{"id":"A06","topic":"Arrays","subtopic":"1D arrays · linear search","difficulty":"Easy","title":"Linear search","statement":"Find the first zero-based index of a target value in an array. Print -1 if it is absent.","inputFormat":"N, then N integers, then target.","outputFormat":"First matching zero-based index, or -1.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n4 7 2 7 9\n7\n","output":"1"},{"input":"4\n3 5 8 2\n6\n","output":"-1"}],"tests":[{"input":"4\n3 5 8 2\n6\n","expected":"-1"},{"input":"5\n4 7 2 7 9\n7\n","expected":"1"},{"input":"1\n5\n5\n","expected":"0"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000], target; cin >> n;\n    for(int i=0;i<n;i++) cin >> arr[i];\n    cin >> target; int pos=-1;\n    for(int i=0;i<n;i++) if(arr[i]==target){ pos=i; break; }\n    cout << pos; return 0;\n}","hints":["Check each element from left to right.","Store the index only when the value matches.","Stop at the first match because the question asks for the first index."],"explanation":"Linear search checks at most N elements and returns the earliest match."},{"id":"A07","topic":"Arrays","subtopic":"1D arrays · binary search","difficulty":"Medium","title":"Binary search in a sorted array","statement":"Given an ascending sorted array, find the zero-based index of target using binary search. Print -1 if absent.","inputFormat":"N, N sorted integers, then target.","outputFormat":"Target index or -1.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"6\n1 3 5 7 9 11\n7\n","output":"3"},{"input":"5\n2 4 6 8 10\n2\n","output":"0"}],"tests":[{"input":"5\n2 4 6 8 10\n2\n","expected":"0"},{"input":"5\n2 4 6 8 10\n9\n","expected":"-1"},{"input":"6\n1 3 5 7 9 11\n7\n","expected":"3"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000], target; cin >> n;\n    for(int i=0;i<n;i++) cin >> arr[i]; cin >> target;\n    int low=0, high=n-1, ans=-1;\n    while(low<=high){\n        int mid=low+(high-low)/2;\n        if(arr[mid]==target){ ans=mid; break; }\n        else if(arr[mid]<target) low=mid+1;\n        else high=mid-1;\n    }\n    cout << ans; return 0;\n}","hints":["Binary search needs sorted input.","Compare the middle element with target.","Discard the left half when arr[mid] < target; otherwise discard the right half."],"explanation":"The low/high interval shrinks by about half on every iteration."},{"id":"A08","topic":"Arrays","subtopic":"1D arrays · bubble sort","difficulty":"Medium","title":"Bubble sort ascending","statement":"Sort N integers in ascending order using bubble sort.","inputFormat":"N followed by N integers.","outputFormat":"Sorted array in ascending order.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n5 1 4 2 8\n","output":"1 2 4 5 8"},{"input":"1\n7\n","output":"7"}],"tests":[{"input":"1\n7\n","expected":"7"},{"input":"4\n4 -1 3 0\n","expected":"-1 0 3 4"},{"input":"5\n5 1 4 2 8\n","expected":"1 2 4 5 8"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000]; cin >> n; for(int i=0;i<n;i++) cin >> arr[i];\n    for(int i=0;i<n-1;i++) for(int k=0;k<n-1-i;k++)\n        if(arr[k]>arr[k+1]){ int temp=arr[k]; arr[k]=arr[k+1]; arr[k+1]=temp; }\n    for(int i=0;i<n;i++) cout << arr[i] << (i+1<n ? \" \" : \"\");\n    return 0;\n}","hints":["Compare adjacent elements.","Swap them when the left value is larger.","After each pass, the largest unsorted value reaches the end."],"explanation":"Bubble sort performs repeated adjacent swaps; temp is used for manual swapping."},{"id":"A09","topic":"Arrays","subtopic":"1D arrays · selection sort","difficulty":"Medium","title":"Selection sort ascending","statement":"Sort N integers in ascending order using selection sort.","inputFormat":"N followed by N integers.","outputFormat":"Sorted array in ascending order.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n64 25 12 22 11\n","output":"11 12 22 25 64"},{"input":"3\n3 2 1\n","output":"1 2 3"}],"tests":[{"input":"3\n3 2 1\n","expected":"1 2 3"},{"input":"4\n-2 7 0 4\n","expected":"-2 0 4 7"},{"input":"5\n64 25 12 22 11\n","expected":"11 12 22 25 64"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000]; cin >> n; for(int i=0;i<n;i++) cin >> arr[i];\n    for(int i=0;i<n-1;i++){\n        int min=i;\n        for(int k=i+1;k<n;k++) if(arr[k]<arr[min]) min=k;\n        int temp=arr[i]; arr[i]=arr[min]; arr[min]=temp;\n    }\n    for(int i=0;i<n;i++) cout << arr[i] << (i+1<n ? \" \" : \"\"); return 0;\n}","hints":["Assume the current position contains the minimum.","Search the unsorted part for a smaller value.","Swap arr[i] with arr[min] after the inner loop."],"explanation":"Selection sort selects the minimum remaining element for each position."},{"id":"A10","topic":"Arrays","subtopic":"1D arrays · insertion sort","difficulty":"Medium","title":"Insertion sort ascending","statement":"Sort the array in ascending order using insertion sort.","inputFormat":"N followed by N integers.","outputFormat":"Sorted array in ascending order.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n5 2 4 6 1\n","output":"1 2 4 5 6"},{"input":"4\n4 3 2 1\n","output":"1 2 3 4"}],"tests":[{"input":"4\n4 3 2 1\n","expected":"1 2 3 4"},{"input":"4\n1 2 3 4\n","expected":"1 2 3 4"},{"input":"5\n5 2 4 6 1\n","expected":"1 2 4 5 6"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000]; cin >> n; for(int i=0;i<n;i++) cin >> arr[i];\n    for(int i=1;i<n;i++){\n        int temp=arr[i], k=i-1;\n        while(k>=0 && arr[k]>temp){ arr[k+1]=arr[k]; k--; }\n        arr[k+1]=temp;\n    }\n    for(int i=0;i<n;i++) cout << arr[i] << (i+1<n ? \" \" : \"\"); return 0;\n}","hints":["Treat the left part as already sorted.","Save the current value in temp.","Shift larger values one position right, then place temp."],"explanation":"Insertion sort inserts each next element into its correct location in the sorted prefix."},{"id":"A11","topic":"Arrays","subtopic":"1D arrays · insertion","difficulty":"Medium","title":"Insert an element at a position","statement":"Insert a value at a valid zero-based position in the array. Positions range from 0 to N.","inputFormat":"N, N integers, then position and value.","outputFormat":"The updated array with N+1 elements.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"4\n10 20 30 40\n2 99\n","output":"10 20 99 30 40"},{"input":"3\n1 2 3\n0 9\n","output":"9 1 2 3"}],"tests":[{"input":"3\n1 2 3\n0 9\n","expected":"9 1 2 3"},{"input":"3\n1 2 3\n3 9\n","expected":"1 2 3 9"},{"input":"4\n10 20 30 40\n2 99\n","expected":"10 20 99 30 40"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1001], pos, value; cin >> n;\n    for(int i=0;i<n;i++) cin >> arr[i]; cin >> pos >> value;\n    for(int i=n;i>pos;i--) arr[i]=arr[i-1];\n    arr[pos]=value;\n    for(int i=0;i<=n;i++) cout << arr[i] << (i<n ? \" \" : \"\"); return 0;\n}","hints":["Make room by shifting values to the right.","Start shifting at index n and stop at pos+1.","Place the new value at arr[pos]."],"explanation":"Right-to-left shifting avoids overwriting elements that still need to move."},{"id":"A12","topic":"Arrays","subtopic":"1D arrays · deletion","difficulty":"Medium","title":"Delete an element at a position","statement":"Delete the element at a valid zero-based position and print the remaining array.","inputFormat":"N, N integers, then position.","outputFormat":"N-1 remaining integers.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n10 20 30 40 50\n2\n","output":"10 20 40 50"},{"input":"3\n1 2 3\n0\n","output":"2 3"}],"tests":[{"input":"3\n1 2 3\n0\n","expected":"2 3"},{"input":"3\n1 2 3\n2\n","expected":"1 2"},{"input":"5\n10 20 30 40 50\n2\n","expected":"10 20 40 50"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000], pos; cin >> n; for(int i=0;i<n;i++) cin >> arr[i]; cin >> pos;\n    for(int i=pos;i<n-1;i++) arr[i]=arr[i+1];\n    for(int i=0;i<n-1;i++) cout << arr[i] << (i+1<n-1 ? \" \" : \"\"); return 0;\n}","hints":["After deletion, later elements must shift left.","Start copying from pos+1 into pos.","Print only n-1 elements."],"explanation":"Left shifting closes the gap created by the deleted element."},{"id":"A13","topic":"Arrays","subtopic":"1D arrays · counting","difficulty":"Easy","title":"Count positive, negative and zero values","statement":"Count how many array elements are positive, negative, and equal to zero.","inputFormat":"N followed by N integers.","outputFormat":"Print positive, negative and zero counts in that order.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"6\n-1 0 4 0 -3 8\n","output":"2 2 2"},{"input":"3\n1 2 3\n","output":"3 0 0"}],"tests":[{"input":"3\n1 2 3\n","expected":"3 0 0"},{"input":"4\n0 -1 0 -2\n","expected":"0 2 2"},{"input":"6\n-1 0 4 0 -3 8\n","expected":"2 2 2"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, x, pos=0, neg=0, zero=0; cin >> n;\n    for(int i=0;i<n;i++){ cin >> x; if(x>0) pos++; else if(x<0) neg++; else zero++; }\n    cout << pos << \" \" << neg << \" \" << zero; return 0;\n}","hints":["Use three counters initialized to zero.","Every value belongs to exactly one of the three categories.","Use if, else if, and else."],"explanation":"The three mutually exclusive conditions count every array value once."},{"id":"A14","topic":"Arrays","subtopic":"1D arrays · second largest","difficulty":"Medium","title":"Second largest distinct element","statement":"Find the second largest distinct value in the array. Print -1 if fewer than two distinct values exist.","inputFormat":"N followed by N integers.","outputFormat":"Second largest distinct value, or -1.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"6\n10 5 8 10 3 8\n","output":"8"},{"input":"4\n5 5 5 5\n","output":"-1"}],"tests":[{"input":"4\n5 5 5 5\n","expected":"-1"},{"input":"5\n-5 -2 -8 -2 -9\n","expected":"-5"},{"input":"6\n10 5 8 10 3 8\n","expected":"8"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000]; cin >> n; for(int i=0;i<n;i++) cin >> arr[i];\n    int first=arr[0], second=0, found=0;\n    for(int i=1;i<n;i++){\n        if(arr[i]>first){ second=first; first=arr[i]; found=1; }\n        else if(arr[i]<first && (!found || arr[i]>second)){ second=arr[i]; found=1; }\n    }\n    if(found) cout << second; else cout << -1; return 0;\n}","hints":["The second largest must be distinct from the largest.","Track the largest and second largest values separately.","Only accept arr[i] as second when arr[i] < first."],"explanation":"The found flag indicates whether a distinct second value has been discovered."},{"id":"A15","topic":"Arrays","subtopic":"1D arrays · frequency","difficulty":"Easy","title":"Frequency of a target element","statement":"Count the number of occurrences of a target value in the array.","inputFormat":"N, N integers, then target.","outputFormat":"The frequency count.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"7\n2 4 2 5 2 8 4\n2\n","output":"3"},{"input":"4\n1 2 3 4\n9\n","output":"0"}],"tests":[{"input":"4\n1 2 3 4\n9\n","expected":"0"},{"input":"5\n7 7 7 7 7\n7\n","expected":"5"},{"input":"7\n2 4 2 5 2 8 4\n2\n","expected":"3"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000], target, count=0; cin >> n;\n    for(int i=0;i<n;i++) cin >> arr[i]; cin >> target;\n    for(int i=0;i<n;i++) if(arr[i]==target) count++;\n    cout << count; return 0;\n}","hints":["Initialize a counter to zero.","Compare each element with target.","Increase the counter for every match."],"explanation":"Frequency is the number of matching elements, not just the first matching index."},{"id":"A16","topic":"Arrays","subtopic":"1D arrays · comparison","difficulty":"Easy","title":"Check whether two arrays are equal","statement":"Read two arrays and determine whether they have the same length and identical elements in the same order.","inputFormat":"N, N elements, M, M elements.","outputFormat":"Print YES if equal, otherwise NO.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"3\n1 2 3\n3\n1 2 3\n","output":"YES"},{"input":"2\n1 2\n3\n1 2 0\n","output":"NO"}],"tests":[{"input":"2\n1 2\n3\n1 2 0\n","expected":"NO"},{"input":"3\n1 2 3\n3\n1 2 3\n","expected":"YES"},{"input":"3\n1 2 3\n3\n1 3 2\n","expected":"NO"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,m,a[1000],b[1000]; cin >> n; for(int i=0;i<n;i++) cin >> a[i];\n    cin >> m; for(int i=0;i<m;i++) cin >> b[i];\n    int same=(n==m);\n    if(same) for(int i=0;i<n;i++) if(a[i]!=b[i]){ same=0; break; }\n    cout << (same ? \"YES\" : \"NO\"); return 0;\n}","hints":["Different lengths mean the arrays cannot be equal.","If lengths match, compare corresponding positions.","Stop when one mismatch is found."],"explanation":"Array equality requires both equal lengths and equal values at every index."},{"id":"A17","topic":"Arrays","subtopic":"1D arrays · rotation","difficulty":"Easy","title":"Left rotate an array by one position","statement":"Move the first element to the end and shift all other elements one position left.","inputFormat":"N followed by N integers.","outputFormat":"The left-rotated array.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"5\n1 2 3 4 5\n","output":"2 3 4 5 1"},{"input":"1\n9\n","output":"9"}],"tests":[{"input":"1\n9\n","expected":"9"},{"input":"4\n8 6 4 2\n","expected":"6 4 2 8"},{"input":"5\n1 2 3 4 5\n","expected":"2 3 4 5 1"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n, arr[1000]; cin >> n; for(int i=0;i<n;i++) cin >> arr[i];\n    if(n>0){ int temp=arr[0]; for(int i=0;i<n-1;i++) arr[i]=arr[i+1]; arr[n-1]=temp; }\n    for(int i=0;i<n;i++) cout << arr[i] << (i+1<n ? \" \" : \"\"); return 0;\n}","hints":["Save the first element before shifting.","Shift arr[i+1] into arr[i].","Put the saved value at arr[n-1]."],"explanation":"The temporary variable preserves the first value while the array shifts left."},{"id":"A18","topic":"Arrays","subtopic":"1D arrays · even and odd count","difficulty":"Easy","title":"Count even and odd elements","statement":"Count the even and odd values in an array.","inputFormat":"N followed by N integers.","outputFormat":"Print even count followed by odd count.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"6\n1 2 3 4 5 6\n","output":"3 3"},{"input":"3\n2 4 8\n","output":"3 0"}],"tests":[{"input":"3\n2 4 8\n","expected":"3 0"},{"input":"4\n-3 -2 0 7\n","expected":"2 2"},{"input":"6\n1 2 3 4 5 6\n","expected":"3 3"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,x,even=0,odd=0; cin >> n;\n    for(int i=0;i<n;i++){ cin >> x; if(x%2==0) even++; else odd++; }\n    cout << even << \" \" << odd; return 0;\n}","hints":["A value divisible by 2 is even.","Use x % 2 == 0 to test evenness.","Every other integer is odd."],"explanation":"The remainder operator determines whether an integer is divisible by two."},{"id":"A19","topic":"Arrays","subtopic":"1D arrays · merging","difficulty":"Medium","title":"Merge two sorted arrays","statement":"Given two ascending arrays, merge them into one ascending array without using a sorting library.","inputFormat":"N, N sorted values, M, M sorted values.","outputFormat":"All N+M values in ascending order.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"3\n1 4 7\n3\n2 3 8\n","output":"1 2 3 4 7 8"},{"input":"2\n1 5\n3\n2 3 4\n","output":"1 2 3 4 5"}],"tests":[{"input":"2\n1 5\n3\n2 3 4\n","expected":"1 2 3 4 5"},{"input":"1\n4\n1\n4\n","expected":"4 4"},{"input":"3\n1 4 7\n3\n2 3 8\n","expected":"1 2 3 4 7 8"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int n,m,a[1000],b[1000],c[2000]; cin >> n; for(int i=0;i<n;i++) cin >> a[i];\n    cin >> m; for(int i=0;i<m;i++) cin >> b[i];\n    int i=0,k=0,t=0;\n    while(i<n && k<m){ if(a[i]<=b[k]) c[t++]=a[i++]; else c[t++]=b[k++]; }\n    while(i<n) c[t++]=a[i++]; while(k<m) c[t++]=b[k++];\n    for(int x=0;x<t;x++) cout << c[x] << (x+1<t ? \" \" : \"\"); return 0;\n}","hints":["Use two indices, one for each array.","Copy the smaller current value into the result.","Append whichever array still has remaining elements."],"explanation":"Because both inputs are sorted, a linear two-pointer merge is sufficient."},{"id":"A20","topic":"Arrays","subtopic":"2D arrays · addition","difficulty":"Easy","title":"Add two matrices","statement":"Read two matrices of the same dimensions and print their sum.","inputFormat":"Rows and columns, then all values of matrix A row-wise, then matrix B row-wise.","outputFormat":"The resulting matrix, one row per line.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2 2\n1 2\n3 4\n5 6\n7 8\n","output":"6 8\n10 12"},{"input":"1 2\n1 3\n4 5\n","output":"5 8"}],"tests":[{"input":"1 2\n1 3\n4 5\n","expected":"5 8"},{"input":"2 1\n-1\n3\n2\n4\n","expected":"1\n7"},{"input":"2 2\n1 2\n3 4\n5 6\n7 8\n","expected":"6 8\n10 12"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int r,c,a[100][100],b[100][100]; cin >> r >> c;\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> a[i][k];\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> b[i][k];\n    for(int i=0;i<r;i++){ for(int k=0;k<c;k++) cout << a[i][k]+b[i][k] << (k+1<c ? \" \" : \"\"); if(i+1<r) cout << \"\\n\"; }\n    return 0;\n}","hints":["The matrices have identical row and column counts.","Add elements at matching row and column positions.","Use nested loops over r and c."],"explanation":"Matrix addition is element-wise: C[i][k] = A[i][k] + B[i][k]."},{"id":"A21","topic":"Arrays","subtopic":"2D arrays · subtraction","difficulty":"Easy","title":"Subtract two matrices","statement":"Read matrices A and B of equal dimensions and print A-B.","inputFormat":"Rows and columns, followed by A and then B.","outputFormat":"The difference matrix.","constraints":"Use standard input and output. Do not hardcode the sample values.","samples":[{"input":"2 2\n8 7\n6 5\n1 2\n3 4\n","output":"7 5\n3 1"},{"input":"1 2\n5 1\n2 8\n","output":"3 -7"}],"tests":[{"input":"1 2\n5 1\n2 8\n","expected":"3 -7"},{"input":"2 1\n0\n-4\n3\n1\n","expected":"-3\n-5"},{"input":"2 2\n8 7\n6 5\n1 2\n3 4\n","expected":"7 5\n3 1"}],"starterCode":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write your solution here\n    return 0;\n}","solution":"#include <iostream>\nusing namespace std;\nint main(){\n    int r,c,a[100][100],b[100][100]; cin >> r >> c;\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> a[i][k];\n    for(int i=0;i<r;i++) for(int k=0;k<c;k++) cin >> b[i][k];\n    for(int i=0;i<r;i++){ for(int k=0;k<c;k++) cout << a[i][k]-b[i][k] << (k+1<c ? \" \" : \"\"); if(i+1<r) cout << \"\\n\"; }\n    return 0;\n}","hints":["Read both matrices in the same order.","Subtract the corresponding element of B from A.","Keep the same dimensions in the output."],"explanation":"Matrix subtraction is element-wise and order matters: A-B is not B-A."},{"id":"A22","topic":"Arrays","subtopic":"2D arrays · multiplication","difficulty":"Medium","title":"Multiply two matrices","statement":"Multiply matrix A (r1 by c1) by matrix B (r2 by c2). The input guarantees c1 equals r2.","inputFormat":"r1 c1, matrix A, r2 c2, matrix
